/* gestão de frota: tema neutro (paleta de 08/10/2026), modo claro e escuro.
   Cor só onde importa: excluir (vermelho), confirmar (verde) e urgência
   (calendário e itens que pedem intervenção imediata, via .urg-scope). */
:root{
  color-scheme:light;
  --bg:#E9E4D8; --surface:#F4EFE4; --surface2:#EEE9DE; --sidebar:#E3DDCF;
  --text:#1E1E1E; --text2:#5E5A52; --text3:#807868;
  --border:#D2CBBB; --border2:#DED8CB;
  --primary:#2E2E2E; --primary-fg:#F4EFE4; --secondary:#D8D2C4; --accent:#E6E4D7; --ring:#2E2E2E;
  --danger:#DC2626; --danger-fg:#FFFFFF; --confirm:#2E7D46; --confirm-fg:#FFFFFF;
  --u-red:#DC2626; --u-orange:#D9622B; --u-yellow:#B98A10; --u-green:#3E8E58;
  --u-red-soft:#F6DED8; --u-orange-soft:#F6E2D4; --u-yellow-soft:#F1E7C8; --u-green-soft:#DDEADC;
  --chart-1:#F26A4B; --chart-2:#1E1E1E; --chart-3:#5E5A52; --chart-4:#A89F8F; --chart-5:#CFC8B8;
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 4px 10px rgba(0,0,0,.1);
  --scrim:rgba(30,30,30,.45);
  --map-land:#E3DDCF; --map-mun:#F1ECE2; --map-line:#D2CBBB; --map-urban:#E6E0D3; --map-road:#FAF7F0; --map-road-case:#CFC8B8; --map-label:#5E5A52;
  --r:6px; --r-sm:4px;
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-serif:'Playfair Display',Georgia,serif;
  --sidebar-w:236px; --rightbar-w:264px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#141414; --surface:#1C1C1C; --surface2:#222222; --sidebar:#101010;
  --text:#E8E3DA; --text2:#9A968E; --text3:#77736C;
  --border:#2C2C2C; --border2:#262626;
  --primary:#D1CFC0; --primary-fg:#1C1C1C; --secondary:#2E2E2E; --accent:#363636; --ring:#D1CFC0;
  --danger:#E5484D; --danger-fg:#FFFFFF; --confirm:#2F8A4E; --confirm-fg:#FFFFFF;
  --u-red:#EF4444; --u-orange:#F08A4B; --u-yellow:#D9B44A; --u-green:#5DB27A;
  --u-red-soft:#3A1D1B; --u-orange-soft:#3A2618; --u-yellow-soft:#352D16; --u-green-soft:#1C2E22;
  --chart-1:#F26A4B; --chart-2:#D9CFC2; --chart-3:#8E8A83; --chart-4:#5C5A56; --chart-5:#3B3B3B;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 6px 15px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6);
  --map-land:#141414; --map-mun:#1C1C1C; --map-line:#2C2C2C; --map-urban:#222222; --map-road:#363636; --map-road-case:#1C1C1C; --map-label:#8E8A83;
}}

  --u-red:#EF4444; --u-orange:#F08A4B; --u-yellow:#D9B44A; --u-green:#5DB27A;
  --u-red-soft:#3A1D1B; --u-orange-soft:#3A2618; --u-yellow-soft:#352D16; --u-green-soft:#1C2E22;
  --chart-1:#F26A4B; --chart-2:#D9CFC2; --chart-3:#8E8A83; --chart-4:#5C5A56; --chart-5:#3B3B3B;

/* nomes antigos: fora dos contextos de urgência tudo vira neutro */
:root{
  --blue:var(--primary); --blue-soft:var(--secondary);
  --red:var(--danger); --red-soft:var(--u-red-soft);
  --green:var(--text2); --green-soft:var(--border2);
  --amber:var(--text2); --amber-soft:var(--border2);
  --yellow:var(--text2); --yellow-soft:var(--border2);
  --orange:var(--text2); --orange-soft:var(--border2);
  --violet:var(--text2);
  --glass:var(--surface); --inv:var(--surface);
}
/* contextos onde a cor indica grau de urgência */
.urg-scope,.cal-grid,.cal-list,.cal-ev,.att,.rb-item,.sev{
  --green:var(--u-green); --green-soft:var(--u-green-soft);
  --amber:var(--u-orange); --amber-soft:var(--u-orange-soft);
  --orange:var(--u-orange); --orange-soft:var(--u-orange-soft);
  --yellow:var(--u-yellow); --yellow-soft:var(--u-yellow-soft);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
svg[viewBox="0 0 24 24"]{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}
.pill svg{width:12px;height:12px;stroke-width:2}
.note>svg{width:17px;height:17px;margin-top:1px}
html{font-size:14px}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.45;letter-spacing:.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-size:1.35rem;font-weight:700} h2{font-size:1.05rem;font-weight:700} h3{font-size:.95rem;font-weight:600} h4{font-size:.85rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text2)} .ink2{color:var(--text2)} .small{font-size:.84rem} .tiny{font-size:.74rem}
.label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100%}
.side{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:var(--r-sm);background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary-fg);flex-shrink:0}
.brand-mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.brand b{font-family:var(--font-serif);font-size:1.15rem;font-weight:700;letter-spacing:0;line-height:1.1;display:block}
.brand span{color:var(--text2);font-size:.72rem;display:block}
.nav{flex:1;padding:6px 10px;display:flex;flex-direction:column}
.nav-group{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--text2);font-weight:500;font-size:.9rem;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--accent);color:var(--text)}
.nav button.on{background:var(--secondary);color:var(--text);font-weight:600}
.nav button svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .count{margin-left:auto;font-size:.7rem;background:var(--secondary);color:var(--text2);padding:1px 6px;border-radius:3px;font-weight:700}
.nav .count.crit{background:var(--danger);color:var(--danger-fg)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border2);font-size:.75rem;color:var(--text3);display:flex;align-items:center;gap:9px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;min-height:61px}
.top h1{font-size:1.2rem;flex-shrink:0}
.crumbs{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--text2);min-width:0}
.crumbs button{border:none;background:none;padding:0;color:var(--text2)} .crumbs button:hover{color:var(--blue)}
.top .spacer{flex:1}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s;flex-shrink:0;position:relative}
.icon-btn:hover{color:var(--text);border-color:var(--text3)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;background:var(--primary);color:var(--primary-fg);border-radius:3px;font-size:.66rem;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;height:36px;padding:0 10px 0 4px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text2);font-weight:600}
.avatar{width:30px;height:30px;border-radius:4px;background:var(--secondary);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0}
.avatar.lg{width:46px;height:46px;border-radius:var(--r);font-size:1rem}
.who .avatar{width:26px;height:26px;border-radius:4px;font-size:.7rem}
.menu-btn{display:none}
.body-wrap{display:grid;grid-template-columns:1fr;flex:1;min-width:0}
.body-wrap.with-rb{grid-template-columns:1fr var(--rightbar-w)}
.content{padding:22px 26px 60px;min-width:0}
.rightbar{border-left:1px solid var(--border);background:var(--surface);padding:18px 16px;min-width:0}
.rb-section{margin-bottom:20px}
.rb-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.rb-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.rb-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);font-size:.8rem;margin-bottom:5px;background:var(--surface2);border:1px solid var(--border2);cursor:pointer;border-left:3px solid var(--border)}
.rb-item:hover{border-color:var(--text3)}
.rb-item small{display:block;color:var(--text3);font-size:.7rem}
.rb-item b{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:.78rem}
.rb-item.warn{border-left-color:var(--yellow)} .rb-item.urg{border-left-color:var(--orange)} .rb-item.bad{border-left-color:var(--red)} .rb-item.ok{border-left-color:var(--green)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head .muted{font-size:.84rem;margin-top:2px}
.demo-bar{background:var(--secondary);color:var(--text2);font-size:.76rem;padding:5px 26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:500}
.demo-bar select{padding:2px 6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:4px;font-size:.76rem;width:auto}

/* ===== Cards ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{font-size:.98rem;font-weight:700}
.panel-b{padding:4px 18px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0;transition:box-shadow .2s,border-color .2s}
.kpi:hover{box-shadow:var(--shadow-lg)}
.kpi .l{font-size:.73rem;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.kpi .l svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.kpi .v{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;line-height:1.1}
.kpi .s{font-size:.72rem;color:var(--text3);margin-top:3px}
.kpi.c-red .v{color:var(--red)} .urg-scope .kpi.c-amber .v{color:var(--amber)} .urg-scope .kpi.c-orange .v{color:var(--orange)} .urg-scope .kpi.c-yellow .v{color:var(--yellow)}
.kpi.zero .v{color:var(--text3)}

.dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 18px;font-size:.88rem}
.dl dt{color:var(--text2)} .dl dd{margin:0;min-width:0;font-weight:500}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pairs>div{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:8px 10px;min-width:0}
.pairs dt{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:700}
.pairs dd{margin:3px 0 0;font-size:.86rem;font-weight:600;overflow-wrap:anywhere}

/* ===== Tables ===== */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
.tbl th{background:var(--surface2);text-align:left;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);padding:10px 14px;border-bottom:1px solid var(--border);border-top:1px solid var(--border2);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface2)}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}

/* plate */
.plate{font-family:var(--font-mono);display:inline-flex;flex-direction:column;border:1.5px solid var(--text);border-radius:3px;overflow:hidden;font-weight:700;line-height:1;background:var(--surface);vertical-align:middle;letter-spacing:.02em}
.plate i{display:block;height:4px;background:var(--text)}
.plate span{padding:3px 6px;font-size:.78rem;font-style:normal;font-variant-numeric:tabular-nums}
.plate.lg span{font-size:1.35rem;padding:6px 12px 7px}
.plate.lg i{height:7px}

/* status */
.st{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;white-space:nowrap;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text3);flex-shrink:0;display:inline-block}
.dot.ok{background:var(--green)} .dot.neu{background:var(--blue)} .dot.warn{background:var(--yellow)} .dot.urg{background:var(--orange)} .dot.bad{background:var(--red)}
.dot.gray{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text3)}
.urg-scope .dot,.cal-grid .dot{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:.73rem;font-weight:600;white-space:nowrap;background:var(--border2);color:var(--text2)}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--yellow-soft);color:var(--yellow)} .pill.urg{background:var(--orange-soft);color:var(--orange)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.neu,.pill.blue{background:var(--secondary);color:var(--text)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.sev{border-left:3px solid transparent} .sev.warn{border-left-color:var(--yellow)} .sev.urg{border-left-color:var(--orange)} .sev.bad{border-left-color:var(--red)} .sev.ok{border-left-color:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:var(--r-sm);font-weight:600;font-size:.88rem;border:1px solid var(--border);transition:all .15s;white-space:nowrap;background:var(--surface);color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--text3);background:var(--accent)}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{background:var(--primary);color:var(--primary-fg);opacity:.88}
.btn.ok{background:var(--confirm);color:var(--confirm-fg);border-color:var(--confirm)}
.btn.ok:hover{background:var(--confirm);color:var(--confirm-fg);filter:brightness(.92)}
.btn.danger{background:var(--danger);color:var(--danger-fg);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--danger-fg);filter:brightness(.92)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:4px}
.btn.lg{padding:13px 18px;font-size:1rem;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.link{border:none;background:none;padding:0;color:var(--text);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--text2)}
.field small{color:var(--text3);font-size:.74rem}
.inp{width:100%;font-size:.93rem;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 11px;outline:none;transition:border .15s,box-shadow .15s;min-height:40px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent)}
textarea.inp{min-height:76px;resize:vertical}
.inp.big{font-size:1.4rem;font-weight:700;min-height:52px;font-variant-numeric:tabular-nums}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .full{grid-column:1/-1}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--surface);font-size:.88rem;font-weight:500;min-width:44px;justify-content:center}
.seg input:checked+span{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.seg.bad input:checked+span{background:var(--danger);color:var(--danger-fg);border-color:var(--danger)}
.toggle{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle i{position:absolute;inset:0;background:var(--border);border-radius:3px;transition:.15s;cursor:pointer}
.toggle i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--surface);border-radius:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+i{background:var(--blue)} .toggle input:checked+i:before{transform:translateX(16px)}
.err{color:var(--red);font-size:.82rem}
.note{background:var(--surface2);border:1px solid var(--border2);padding:11px 13px;border-radius:var(--r-sm);font-size:.86rem;color:var(--text2);display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--yellow-soft);border-color:transparent;color:var(--yellow)} .note.bad{background:var(--red-soft);border-color:transparent;color:var(--red)} .note.ok{background:var(--green-soft);border-color:transparent;color:var(--green)} .note.urg{background:var(--orange-soft);border-color:transparent;color:var(--orange)} .note.neu{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.note>div{min-width:0}

/* checklist items */
.ck{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border2)}
.ck:last-child{border-bottom:0}
.ck .seg span{padding:7px 10px;font-size:.84rem;min-width:0}

/* photos */
.photos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ph{position:relative;border:2px dashed var(--border);border-radius:var(--r-sm);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--surface2);text-align:center;padding:6px;overflow:hidden;max-width:100%;font-size:.78rem;color:var(--text2)}
.ph:hover{border-color:var(--text2);color:var(--text);background:var(--accent)}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.done{border-style:solid;border-color:var(--text2)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:3px 5px;z-index:1}
.ph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--border);cursor:pointer}

/* timeline (CliqueObras) */
.tl{list-style:none;margin:0;padding:0 0 0 24px;position:relative}
.tl:before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl li{position:relative;padding:0 0 14px 12px}
.tl li:before{content:'';position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid var(--surface)}
.tl li.ok:before{background:var(--green)} .tl li.bad:before{background:var(--red)} .tl li.warn:before{background:var(--yellow)} .tl li.urg:before{background:var(--orange)} .tl li.gray:before{background:var(--text3)}
.tl li.day{padding:6px 0 8px 12px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.tl li.day:before{display:none}
.tl .t{font-size:.74rem;color:var(--text3);font-variant-numeric:tabular-nums;font-weight:600}
.tl .x{font-size:.88rem}
.tl .x small{display:block;color:var(--text3);font-size:.75rem}

/* stepper */
.steps{display:flex;overflow-x:auto;gap:4px}
.step{flex:1;min-width:108px;font-size:.72rem;color:var(--text3);padding-top:8px;border-top:4px solid var(--border2);line-height:1.3;font-weight:500}
.step.done{border-top-color:var(--green);color:var(--text2)}
.step.cur{border-top-color:var(--blue);color:var(--blue);font-weight:700}

/* attention list */
.att{list-style:none;margin:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:7px}
.att li{display:flex;gap:11px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border2);font-size:.86rem;background:var(--surface2);align-items:center;cursor:pointer}
.att li:hover{border-color:var(--text3)}
.att .ic{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.att .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.att .ic.bad{background:var(--red-soft);color:var(--red)} .att .ic.urg{background:var(--orange-soft);color:var(--orange)} .att .ic.warn{background:var(--yellow-soft);color:var(--yellow)} .att .ic.ok{background:var(--green-soft);color:var(--green)} .att .ic.neu{background:var(--blue-soft);color:var(--blue)}
.att b{display:block;font-size:.86rem}
.att small{display:block;color:var(--text3);font-size:.75rem}
.att .when{margin-left:auto;font-size:.74rem;color:var(--text3);white-space:nowrap}

/* progress / bars */
.bar{height:6px;background:var(--border2);border-radius:2px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.bar.ok i{background:var(--green)} .bar.warn i{background:var(--yellow)} .bar.urg i{background:var(--orange)} .bar.bad i{background:var(--red)} .bar.gray i{background:var(--text3)}
.progress{height:7px;background:var(--border2);border-radius:3px;overflow:hidden} .progress i{display:block;height:100%;background:var(--blue);border-radius:3px}
.ring{--p:0;--c:var(--blue);width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--border2) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.ring.sm{width:40px;height:40px} .ring.sm span{width:31px;height:31px;font-size:.78rem}

/* map */

.mlabel.proj{font-size:11px;font-weight:700;color:var(--text);transform:translate(10px,-6px);text-shadow:0 0 3px var(--map-mun),0 0 3px var(--map-mun),0 0 2px var(--map-mun)}

/* fleet status board */

.person{display:flex;align-items:center;gap:10px;min-width:0}

/* vehicle / driver cards */
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;transition:box-shadow .2s,border-color .2s}

.ico{display:inline-flex;align-items:center;gap:4px}

/* calendar (CliqueObras cal-grid) */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}

.cal-ev.warn{background:var(--yellow-soft);color:var(--yellow)} .cal-ev.urg{background:var(--orange-soft);color:var(--orange)} .cal-ev.bad{background:var(--red-soft);color:var(--red)} .cal-ev.ok{background:var(--green-soft);color:var(--green)} .cal-ev.neu{background:var(--blue-soft);color:var(--blue)} .cal-ev.rent{background:var(--accent);color:var(--text2);box-shadow:inset 2px 0 0 var(--text3)}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}

.drv{max-width:540px;margin:0 auto;width:100%;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}

    const t = d.telemetry || {}; const cs = D.custody.filter(c => c.driverId === d.id && (!c.end || c.end > m0) && D.vehicles.find(v => v.id === c.vehicleId)?.tracker);

  });

}

function planState(p) {
  const v = veh(p.vehicleId); const m = S.settings.maint;

}

/* ----- abastecimento ----- */
function fuelMetrics(f) {
  const prev = S.fuel.filter(x => x.vehicleId === f.vehicleId && x.at < f.at).sort((a, b) => b.at - a.at)[0];
  const v = veh(f.vehicleId);
  if (!prev) return { dist: null, kmL: null, costKm: null, delta: null, avg: v.avgKmL };
  const dist = f.km - prev.km;
  const kmL = dist > 0 ? dist / f.liters : null;
  const costKm = dist > 0 ? f.total / dist : null;
  const avg = vehicleAvgKmL(f.vehicleId, f.at) || v.avgKmL;
  const delta = kmL ? (kmL - avg) / avg * 100 : null;
  return { dist, kmL, costKm, delta, avg };
}
function vehicleAvgKmL(vid, before = Infinity) {
  const fs = S.fuel.filter(x => x.vehicleId === vid && x.at < before).sort((a, b) => a.at - b.at);
  if (fs.length < 3) return veh(vid).avgKmL;
  const first = fs[0], last = fs.at(-1);
  const liters = sum(fs.slice(1), x => x.liters);
  return liters > 0 ? (last.km - first.km) / liters : veh(vid).avgKmL;
}
const fuelOutlier = f => { const m = fuelMetrics(f); return m.delta != null && Math.abs(m.delta) > S.settings.fuelDeviationPct ? m : null; };

/* ----- cruzamento pedágio / multa com a posse ----- */
function matchAt(plate, ts) {

function periodCosts(from, to) {
  const inP = t => t >= from && t < to;
  const rows = [];

  rows.push(...docCosts(from, to));

function kmInPeriod(from, to, filter = () => true) {
  // km rodados = soma dos trechos de posse dentro do período (proporcional quando a posse cruza o período)
  let total = 0;
  S.custody.filter(filter).forEach(c => {
    const end = c.end || nowTs(); const endKm = c.endKm ?? veh(c.vehicleId).odometer;
    const a = Math.max(c.start, from), b = Math.min(end, to);
    if (b <= a || end <= c.start) return;
    total += (endKm - c.startKm) * (b - a) / (end - c.start);

}

/* ----- índice de conformidade do condutor (métricas configuradas pelo gestor) ----- */
const CRITERIA = {
  checklist: { l: 'Checklists e registros', d: 'Checklists diários feitos no prazo' },
  conservacao: { l: 'Conservação do veículo', d: 'Avarias não comunicadas e limpeza' },
  abastecimento: { l: 'Abastecimentos', d: 'Registros completos com cupom e km' },
  infracoes: { l: 'Sem infrações', d: 'Multas no período' },
  procedimentos: { l: 'Procedimentos', d: 'Transferências, obra vinculada e telemetria' }
};
function driverScore(did, from = startOfMonth(nowTs()), to = nowTs()) {
  const cfg = S.settings.score; const C = cfg.criteria; const P = cfg.penalties; const d = drv(did);
  const cs = S.custody.filter(c => c.driverId === did && c.start < to && (!c.end || c.end > from));
  let req = 0, done = 0, late = 0;
  cs.forEach(c => {
    for (let day = startOfDay(Math.max(c.start, from)); day <= startOfDay(Math.min(c.end || to, to)); day += DAY) {
      if (new Date(day).getDay() === 0) continue;
      req++;
      const k = S.checklists.find(k => k.custodyId === c.id && ['diario', 'recebimento'].includes(k.type) && startOfDay(k.at) === day);
      if (k) { done++; if (k.late) late++; }
    }
  });
  const ratio = { checklist: req ? Math.max(0, (done - late * (P.atraso / 100)) / req) : 1 };
  const fulls = S.checklists.filter(k => k.driverId === did && k.at >= from && k.at < to && k.items);
  const dirty = fulls.filter(k => k.items.limpeza === 'ruim').length;
  const avarias = d.telemetry?.avarias || 0;
  const fuels = S.fuel.filter(f => f.driverId === did && f.at >= from && f.at < to);
  const okFuel = fuels.filter(f => f.receipt && f.km && f.liters && f.total).length;
  const fines = S.fines.filter(f => f.at >= from && f.at < to && fineMatch(f).driverId === did);
  const forced = S.transfers.filter(t => t.forced && t.fromDriverId === did && t.requestedAt >= from).length;
  const noProj = cs.filter(c => !c.segments.length).length;
  const tel = (S.trackerEvents || []).filter(e => e.driverId === did && e.at >= from && e.at < to && TELEMETRY_ALARMS.includes(e.type)).length;
  const pen = {
    conservacao: avarias * P.avaria + dirty * P.limpeza,
    infracoes: sum(fines, f => P[f.gravity] ?? P.media),
    procedimentos: forced * P.forcada + noProj * P.semObra + tel * P.telemetria
  };
  const info = {
    checklist: req ? `${done} de ${req} diários · ${late} com atraso` : 'Sem posse no período',
    conservacao: `${avarias} avaria(s) não comunicada(s) · ${dirty} limpeza ruim`,
    abastecimento: fuels.length ? `${okFuel} de ${fuels.length} completos` : 'Sem abastecimentos',
    infracoes: fines.length ? `${fines.length} multa(s)` : 'Nenhuma multa',
    procedimentos: `${forced} forçada(s) · ${noProj} sem obra · ${tel} alerta(s) do rastreador`
  };
  const parts = Object.entries(C).filter(([, c]) => c.on).map(([k, c]) => {
    let v;
    if (k === 'checklist') v = c.weight * ratio.checklist;
    else if (k === 'abastecimento') v = fuels.length ? c.weight * okFuel / fuels.length : c.weight;
    else v = Math.max(0, c.weight - pen[k]);
    return { k, l: CRITERIA[k].l, v, max: c.weight, info: info[k] };
  });
  const maxT = sum(parts, p => p.max) || 100;
  const total = sum(parts, p => p.v) / maxT * 100;
  return { total, bonus: bonusFor(total), tier: tierFor(total), parts, req, done, late, fines };
}
function tierFor(score) { const t = [...S.settings.score.tiers].sort((a, b) => b.min - a.min).find(t => score >= t.min); return t || null; }
function bonusFor(score) {
  const cfg = S.settings.score;
  if (cfg.mode === 'faixas') return tierFor(score)?.value || 0;
  return score >= cfg.minScore ? cfg.maxBonus * score / 100 : 0;
}
/* cor da pontuação: verde (faixa máxima), amarelo, laranja (faixa mínima), vermelho (sem prêmio).
   Usa as 3 primeiras faixas configuradas; sem elas, 90/80/70. */
function scoreCuts() {
  const t = (S.settings.score.tiers || []).map(x => +x.min).filter(n => n > 0).sort((a, b) => b - a);
  return t.length >= 3 ? t.slice(0, 3) : [90, 80, 70];
}
function scoreTone(s) { const [a, b, c] = scoreCuts(); return s >= a ? 'ok' : s >= b ? 'warn' : s >= c ? 'urg' : 'bad'; }
const SCORE_VAR = { ok: '--u-green', warn: '--u-yellow', urg: '--u-orange', bad: '--u-red' };
const scoreColor = s => `var(${SCORE_VAR[scoreTone(s)]})`;
const pctTone = (v, max) => scoreTone(max ? v / max * 100 : 0);

    });

  S.transfers.filter(t => !['concluida', 'cancelada'].includes(t.status)).forEach(t => {

  S.fuel.filter(f => nowTs() - f.at < 7 * DAY).forEach(f => { const m = fuelOutlier(f); if (m && m.delta < 0) out.push({ c: 'warn', r: 2, icon: 'fuel', title: `${veh(f.vehicleId).plate} · consumo alto`, sub: `${nf(m.kmL, 1)} km/l (${nf(m.delta, 0)}% da média)`, text: '', at: f.at, go: { page: 'abastecimento' } }); });
  const unT = S.tolls.filter(t => tollMatch(t).how === 'sem').length;

  out.push(...docAttention());
  return out.sort((a, b) => b.r - a.r);
}

/* ----- última localização registrada (celular do condutor no checklist) ----- */
function lastLocation(vid) {
  // posição mais recente entre o rastreador (Traccar) e o celular do condutor no checklist
  const k = S.checklists.filter(x => x.vehicleId === vid && x.location).sort((a, b) => b.at - a.at)[0];
  const t = S.locations[vid]; const v = veh(vid);
  const fromT = t && v?.tracker && S.settings.traccar?.mode !== 'off' ? { lat: t.lat, lng: t.lng, at: t.at, source: 'rastreador', what: `Rastreador${t.speed > 3 ? ` · ${t.speed} km/h` : t.ignition ? ' · ligado' : ' · parado'}`, driverId: null } : null;
  const fromK = k ? { lat: k.location.lat, lng: k.location.lng, at: k.at, source: k.location.source, what: `Checklist ${CK_TYPES[k.type].toLowerCase()}`, driverId: k.driverId } : null;
  if (fromT && (!fromK || fromT.at >= fromK.at)) return fromT;
  return fromK || fromT;
}


/* ----- localização ----- */
function currentLocation(vid) {
  const l = S.locations[vid]; if (!l) return null;
  return { lat: l.lat, lng: l.lng, source: 'rastreador', at: l.at };
}
function nearestPlace(l) {
  if (!l) return 'Sem rastreador';
  let best = null, bd = 1e9;
  S.projects.forEach(p => { const d = Math.hypot(p.lat - l.lat, (p.lng - l.lng) * .92) * 111; if (d < bd) { bd = d; best = p; } });
  if (bd < 1.2) return best.code === 'Matriz' ? 'Matriz (pátio)' : `${best.code} (canteiro)`;
  if (Math.abs(l.lat + 22.872) < .004 && Math.abs(l.lng + 47.098) < .004) return 'Oficina Mecânica Alvorada';
  return `${nf(bd, 1)} km de ${best.code}`;
}
// simulação do rastreador: veículos com ignição ligada andam um pouco a cada ciclo
function tickTelemetry() {
  S.vehicles.forEach(v => {
    const l = S.locations[v.id]; if (!l || !v.tracker || !activeCustody(v.id) || v.maintenance || openIssues(v.id).some(i => !i.canRun)) return;
    if (!l.ignition) { if (Math.random() < .08) { l.ignition = true; l.speed = 0; } l.at = nowTs(); return; }
    const seg = currentSegment(activeCustody(v.id)); const p = seg ? prj(seg.projectId) : null;
    const tgt = p || { lat: -22.9, lng: -47.06 };
    const dLat = tgt.lat - l.lat, dLng = tgt.lng - l.lng, dist = Math.hypot(dLat, dLng);
    if (dist < .004) { l.speed = 0; if (Math.random() < .5) l.ignition = false; }
    else {
      const step = Math.min(dist, .003 + Math.random() * .004);
      l.lat += dLat / dist * step + (Math.random() - .5) * .0015; l.lng += dLng / dist * step + (Math.random() - .5) * .0015;
      l.speed = Math.round(35 + Math.random() * 55);
      const inc = Math.round(step * 111 * 1.3);
      v.odometer += inc; l.km = v.odometer;
    }
    l.at = nowTs();
  });
}

// redimensiona a foto para caber no armazenamento do protótipo
function readPhoto(file, maxW = 640) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width); const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .62));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function receiveCheck(v, did) {
  const c = activeCustody(v.id); const t = activeTransfer(v.id);
  if (drv(did)?.active === false) return { ok: false, msg: 'Seu cadastro de condutor está inativo. Procure a gestão da frota.' };
  if (c && c.driverId === did) return { ok: false, mine: true, msg: 'Este veículo já está sob sua responsabilidade.' };
  if (v.maintenance) return { ok: false, msg: 'Veículo em manutenção. O recebimento só é liberado após o checklist de saída da manutenção.' };
  if (openIssues(v.id).some(i => !i.canRun)) return { ok: false, msg: 'Veículo bloqueado por problema crítico. Aguarde a liberação da gestão.' };
  if (c) return { ok: false, other: c, t, msg: `Veículo atualmente sob responsabilidade de ${drv(c.driverId).name}. Para receber este veículo, o atual responsável deve realizar a entrega.` };
  if (t && t.toDriverId !== did) return { ok: false, t, msg: `Existe uma transferência em andamento para ${drv(t.toDriverId).name}.` };
  if (S.settings.oneVehiclePerDriver) { const mine = driverCustodies(did); if (mine.length) return { ok: false, msg: `Você já está com o veículo ${veh(mine[0].vehicleId).plate}. Entregue-o antes de receber outro.` }; }
  return { ok: true, t };
}

function requestTransfer(v, did) {

  S.transfers.push(t);

}

/* ---------- Scanner ---------- */
let CAM = null;
function stopCamera() { if (CAM) { CAM.stream?.getTracks().forEach(t => t.stop()); cancelAnimationFrame(CAM.raf); CAM = null; } }
function resolveCode(txt) {
  const s = String(txt || '').trim().toUpperCase();
  const m = s.match(/VLK1-[A-Z0-9]{16}/);
  if (m) {
    const q = S.qrcodes.find(q => q.token === m[0]);
    if (!q) return { err: 'QR Code não reconhecido.' };
    if (!q.active) return { err: 'Este QR Code foi substituído e não é mais válido. Procure a gestão da frota.' };
    return { vid: q.vehicleId };
  }
  const v = vehicleByPlate(s); if (v) return { vid: v.id };
  return { err: 'Código não reconhecido. Confira a placa ou o QR Code.' };
}
function onScanned(txt) {
  const r = resolveCode(txt);
  if (r.err) { const el = $('#scan-err'); if (el) el.textContent = r.err; else toast(r.err); return; }
  stopCamera();
  log('qr', `QR Code lido por ${CUR.name}`, { vehicleId: r.vid, driverId: CUR.driverId });
  save(); go('scan_result', { vid: r.vid });
}

        <form id="code-form" class="row" style="flex-wrap:nowrap"><input class="inp" id="code-inp" name="code" placeholder="Placa ou código do QR" autocomplete="off" aria-label="Placa ou código"><button class="btn">Buscar</button></form>

    </div>`;
  },

    $('#code-form').addEventListener('submit', e => { e.preventDefault(); onScanned($('#code-inp').value); });

      const f = e.target.files[0]; if (!f) return;

        const d = x.getImageData(0, 0, c.width, c.height);

ACTIONS['cam-start'] = async () => {
  const msg = $('#cam-msg');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const box = $('#scan-box'); $('#scan-idle').hidden = true;
    const video = document.createElement('video'); video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream;
    box.appendChild(video); const fr = document.createElement('div'); fr.className = 'frame'; box.appendChild(fr);
    await video.play();
    const c = document.createElement('canvas'); const x = c.getContext('2d', { willReadFrequently: true });
    CAM = { stream, raf: 0 };
    const loop = () => {
      if (!CAM) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
        c.width = video.videoWidth; c.height = video.videoHeight; x.drawImage(video, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height); const code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
        if (code?.data) { onScanned(code.data); return; }
      }
      CAM.raf = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    msg.textContent = 'A câmera não está disponível neste navegador ou a permissão foi negada. Use a leitura por foto, digite a placa ou simule a leitura abaixo.';
  }
};

      } else {

      action = `<div class="row"><button class="btn pri" data-go="veiculo" data-id="${vid}">Abrir histórico completo</button>${isManager() && c ? `<button class="btn" data-go="forcar" data-vid="${vid}">Transferência forçada</button>` : ''}</div>`;
    }
    const wrap = CUR.role === 'condutor' ? 'drv' : 'drv" style="margin:0;max-width:560px';

ACTIONS['t-request'] = a => { const v = veh(a.dataset.vid); const t = requestTransfer(v, CUR.driverId); toast(`Solicitação enviada para ${drv(t.fromDriverId).name}.`); go('scan_result', { vid: v.id }); };

/* ---------- Checklist completo (componente) ---------- */
function newDraft(kind, vid, extra = {}) {
  const v = veh(vid);
  DRAFT = { kind, vid, km: suggestedKm(v), fuel: '', items: {}, avarias: '', notes: '', photos: {}, geo: null, ...extra };
}
function ckHeader(v, extra = '') {
  const c = activeCustody(v.id); const d = myDriver();
  return `<div class="veh-card"><div class="top-line">${plate(v.plate, true)}<span class="muted small">${esc(v.brand)} ${esc(v.model)}</span></div>
    <dl class="kv"><dt>Condutor</dt><dd>${d ? esc(d.name) : esc(CUR.name) + ' <span class="muted">(gestão)</span>'}</dd>
    <dt>Data e hora</dt><dd>${fmtDT(nowTs())}</dd>${extra}
    <dt>Localização</dt><dd class="small" id="geo-txt">${geoText(DRAFT.geo)}</dd></dl></div>`;
}
function fullChecklistBody(v) {
  const D = DRAFT;
  const items = CK_ITEMS.map(([k, l]) => {
    const opts = PRESENCE.includes(k) ? [['ok', 'Presente'], ['ruim', 'Ausente']] : [['ok', 'OK'], ['regular', 'Regular'], ['ruim', 'Ruim']];
    return `<div class="ck"><span>${l}</span><div class="seg" role="radiogroup" aria-label="${l}">${opts.map(([val, lab]) => `<label><input type="radio" name="it_${k}" value="${val}" ${D.items[k] === val ? 'checked' : ''}><span>${lab}</span></label>`).join('')}</div></div>`;
  }).join('');
  return `
    <div class="panel"><div class="panel-h"><h3>Quilometragem e combustível</h3></div><div class="panel-b form-grid">
      <label class="field"><span>Quilometragem atual</span><input class="inp big num" name="km" inputmode="numeric" value="${D.km ?? ''}" aria-describedby="km-h"><small id="km-h">${v.tracker ? 'Sugerida pelo rastreador. Confira no painel.' : `Último registro: ${km(lastRecordedKm(v.id))}`}</small></label>
      <div class="field"><span>Nível de combustível</span><div class="seg">${FUEL_LEVELS.map(f => `<label><input type="radio" name="fuel" value="${f}" ${D.fuel === f ? 'checked' : ''}><span>${f}</span></label>`).join('')}</div></div>
    </div></div>
    <div class="panel"><div class="panel-h"><h3>Itens do veículo</h3><button type="button" class="btn sm" data-act="ck-allok">Marcar todos como OK</button></div><div class="panel-b" style="padding-block:4px">${items}</div></div>
    <div class="panel"><div class="panel-h"><h3>Avarias e observações</h3></div><div class="panel-b form-grid">
      <label class="field full"><span>Avarias encontradas</span><textarea class="inp" name="avarias" placeholder="Deixe em branco se não houver avarias">${esc(D.avarias)}</textarea></label>
      <label class="field full"><span>Observações</span><textarea class="inp" name="notes">${esc(D.notes)}</textarea></label>
    </div></div>
    <div class="panel"><div class="panel-h"><h3>Fotos obrigatórias</h3><button type="button" class="btn sm" data-act="ck-demo-photos">Usar fotos de exemplo</button></div>
      <div class="panel-b"><div class="photos">${PHOTO_SLOTS.map(([k, l]) => photoTile(k, l)).join('')}</div></div></div>`;
}
function photoTile(k, l) {
  const p = DRAFT.photos[k];
  return `<label class="ph ${p ? 'done' : ''}" data-slot="${k}">${p ? `<img src="${photoSrc(p)}" alt=""><span class="cap">${l} ✓</span>` : `${ic('camera')}<span>${l}</span>`}<input type="file" accept="image/*" capture="environment" data-photo="${k}" aria-label="Foto ${l}"></label>`;
}
function bindDraft(form) {
  const upd = e => {
    const el = e.target; if (!el.name) return;
    if (el.name.startsWith('it_')) DRAFT.items[el.name.slice(3)] = el.value;
    else if (el.type === 'file') return;
    else DRAFT[el.name] = el.value;
    DRAFT._onChange?.();
  };
  form.addEventListener('input', upd); form.addEventListener('change', upd);
  form.addEventListener('change', async e => {
    const slot = e.target.dataset.photo; if (!slot || !e.target.files[0]) return;
    DRAFT.photos[slot] = await readPhoto(e.target.files[0]);
    const tile = form.querySelector(`[data-slot="${slot}"]`);
    const lab = { cupom: 'Foto do cupom ou nota fiscal', problema: 'Foto do problema', painel_d: 'Foto do painel (opcional)' }[slot] || (PHOTO_SLOTS.find(s => s[0] === slot) || [0, 'Foto'])[1];
    if (tile) tile.outerHTML = slot === 'cupom' || slot === 'problema' || slot === 'painel_d' ? singlePhoto(slot, lab) : photoTile(slot, lab);
    DRAFT._onChange?.();
  });
}
ACTIONS['ck-allok'] = () => { CK_ITEMS.forEach(([k]) => { DRAFT.items[k] = 'ok'; const r = $(`input[name="it_${k}"][value="ok"]`); if (r) r.checked = true; }); };
ACTIONS['ck-demo-photos'] = () => { PHOTO_SLOTS.forEach(([k, l]) => { if (!DRAFT.photos[k]) DRAFT.photos[k] = 'demo:' + k; const t = $(`[data-slot="${k}"]`); if (t) t.outerHTML = photoTile(k, l); }); };
function singlePhoto(slot, label) {
  const p = DRAFT.photos[slot];
  return `<label class="ph ${p ? 'done' : ''}" data-slot="${slot}" style="aspect-ratio:auto;min-height:92px;flex-direction:row;gap:10px">${p ? `<img src="${photoSrc(p)}" alt=""><span class="cap">${label} ✓ (toque para trocar)</span>` : `${ic('camera')}<span>${label}</span>`}<input type="file" accept="image/*" capture="environment" data-photo="${slot}" aria-label="${label}"></label>`;
}
function validateFull(v) {
  const e = [];
  const k = parseInt(String(DRAFT.km).replace(/\D/g, ''), 10);
  if (!k) e.push('Informe a quilometragem.');
  else if (k < lastRecordedKm(v.id)) e.push(`A quilometragem não pode ser menor que o último registro (${km(lastRecordedKm(v.id))}).`);
  if (!DRAFT.fuel) e.push('Informe o nível de combustível.');
  const miss = CK_ITEMS.filter(([x]) => !DRAFT.items[x]).map(([, l]) => l);
  if (miss.length) e.push(`Avalie todos os itens (faltam ${miss.length}).`);
  if (S.settings.requirePhotos) { const mp = PHOTO_SLOTS.filter(([x]) => !DRAFT.photos[x]).map(([, l]) => l.toLowerCase()); if (mp.length) e.push(`Fotos obrigatórias pendentes: ${mp.join(', ')}.`); }
  return { e, km: k };
}
function saveFullChecklist(type, v, driverId, custodyId, kmv) {
  const ck = { id: uid('ck'), type, vehicleId: v.id, driverId, userId: CUR.id, custodyId, at: nowTs(), km: kmv, fuelLevel: DRAFT.fuel, items: { ...DRAFT.items }, ok: !DRAFT.avarias && !Object.values(DRAFT.items).includes('ruim'), problem: null, avarias: DRAFT.avarias, notes: DRAFT.notes, photos: { ...DRAFT.photos }, location: DRAFT.geo, late: false };
  S.checklists.push(ck);
  v.odometer = Math.max(v.odometer, kmv); if (S.locations[v.id]) S.locations[v.id].km = v.odometer;
  const bad = CK_ITEMS.filter(([x]) => DRAFT.items[x] === 'ruim').map(([, l]) => l);
  log('checklist', `Checklist de ${CK_TYPES[type].toLowerCase()} concluído (${nf(kmv)} km)${bad.length || DRAFT.avarias ? ` com apontamentos: ${[...bad, DRAFT.avarias].filter(Boolean).join('; ')}` : ''}`, { vehicleId: v.id, driverId, data: { checklistId: ck.id } });
  return ck;
}
const showErrors = e => { const el = $('#ck-err'); el.innerHTML = e.map(x => `<div>${esc(x)}</div>`).join(''); el.hidden = !e.length; if (e.length) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); };

/* ---------- Recebimento ---------- */
PAGES.receber = {
  driver: true, title: 'Recebimento do veículo',
  render({ vid }) {
    const v = veh(vid); const rc = receiveCheck(v, CUR.driverId);
    if (!rc.ok) return `<div class="drv"><h1>Recebimento</h1><div class="note bad">${esc(rc.msg)}</div><button class="btn" data-go="scan_result" data-vid="${vid}">Voltar</button></div>`;
    if (!DRAFT || DRAFT.kind !== 'receber') {
      newDraft('receber', vid, { projectId: '', ccId: '', purpose: PURPOSES[0] });
      const t = rc.t;
      if (t && t.status === 'aguardando_recebimento') { setTransfer(t, 'recebimento_andamento', 'Novo condutor iniciou o checklist de recebimento'); log('transferencia', `${drv(t.toDriverId).name} iniciou o checklist de recebimento`, { vehicleId: vid, driverId: t.toDriverId }); save(); }
      captureLocation(v);
    }
    const tInfo = rc.t ? `<div class="note">Transferência de ${esc(drv(rc.t.fromDriverId).name)} para você. Estado: <b>${T_LABEL[rc.t.status]}</b>.</div>` : '';
    const first = !S.custody.some(c => c.vehicleId === vid);
    return `<form class="drv" id="ckform" novalidate>
      <div><p class="label">Checklist completo · ${first ? 'Primeiro recebimento' : rc.t ? 'Troca de condutor' : 'Recebimento'}</p><h1>Recebimento do veículo</h1></div>
      ${tInfo}${ckHeader(v)}
      <div class="panel"><div class="panel-h"><h3>Obra e finalidade</h3><span class="muted small">Obrigatório para iniciar a posse</span></div><div class="panel-b form-grid">
        <label class="field full"><span>Obra</span><select class="inp" name="projectId" id="f-proj"><option value="">Selecione a obra</option>${projectOptions(DRAFT.projectId)}</select></label>
        <label class="field"><span>Centro de custo</span><select class="inp" name="ccId" id="f-cc"><option value="">Automático pela obra</option>${ccOptions(DRAFT.ccId)}</select></label>
        <label class="field"><span>Atividade ou finalidade</span><select class="inp" name="purpose">${purposeOptions(DRAFT.purpose)}</select></label>
      </div></div>
      ${fullChecklistBody(v)}
      <div class="note bad" id="ck-err" hidden role="alert"></div>
      <div class="sticky-foot"><button type="button" class="btn lg" data-go="scan_result" data-vid="${vid}">Cancelar</button><button class="btn ok lg" style="flex:1">Concluir e assumir a posse</button></div>
    </form>`;
  },
  mount({ vid }) {
    const f = $('#ckform'); if (!f) return; bindDraft(f);
    $('#f-proj').addEventListener('change', e => { const p = prj(e.target.value); if (p) { DRAFT.ccId = p.ccId; $('#f-cc').value = p.ccId; } });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = veh(vid); const { e: errs, km: k } = validateFull(v);
      if (!DRAFT.projectId) errs.unshift('Selecione a obra ou centro de custo.');
      if (errs.length) return showErrors(errs);
      const rc = receiveCheck(v, CUR.driverId); if (!rc.ok) return showErrors([rc.msg]);
      const did = CUR.driverId; const p = prj(DRAFT.projectId);
      const c = { id: uid('cus'), vehicleId: vid, driverId: did, start: nowTs() + 1, end: null, startKm: k, endKm: null, receiveChecklistId: null, deliverChecklistId: null, segments: [{ at: nowTs(), projectId: p.id, ccId: DRAFT.ccId || p.ccId, purpose: DRAFT.purpose, by: did }], closedReason: null, transferId: rc.t?.id || null };
      const ck = saveFullChecklist('recebimento', v, did, c.id, k);
      c.receiveChecklistId = ck.id; S.custody.push(c);
      log('posse_inicio', `${drv(did).name} recebeu o veículo. Posse iniciada`, { vehicleId: vid, driverId: did, at: nowTs() + 1 });
      log('obra', `Vinculado à ${p.code} · ${ccOf(DRAFT.ccId || p.ccId).code} · ${DRAFT.purpose}`, { vehicleId: vid, driverId: did, at: nowTs() + 2 });
      if (rc.t) {
        rc.t.receiveChecklistId = ck.id; rc.t.toCustodyId = c.id; setTransfer(rc.t, 'concluida', 'Checklist de recebimento aprovado; posse transferida');
        log('transferencia', `Transferência concluída: ${drv(rc.t.fromDriverId).name} → ${drv(did).name}`, { vehicleId: vid, driverId: did, at: nowTs() + 3 });
        notify(rc.t.fromDriverId, `${drv(did).name} recebeu o ${v.plate}. Transferência concluída.`);
      }
      save(); toast(`Posse iniciada: ${v.plate} está com você.`); go('meu_veiculo', { vid });
    });
  }
};

/* ---------- Entrega ---------- */
PAGES.entregar = {
  driver: true, title: 'Entrega do veículo',
  render({ vid, tid }) {
    const d = myDriver(); const cs = d ? driverCustodies(d.id) : [];
    vid = vid || cs[0]?.vehicleId;
    if (!vid) return `<div class="drv"><h1>Entregar veículo</h1><div class="note">Você não está com nenhum veículo.</div></div>`;
    const v = veh(vid); const c = activeCustody(vid);
    if (!c || c.driverId !== CUR.driverId) return `<div class="drv"><h1>Entregar veículo</h1><div class="note bad">Somente o condutor responsável pode entregar este veículo.</div></div>`;
    const t = tid ? byId(S.transfers, tid) : activeTransfer(vid);
    if (!DRAFT || DRAFT.kind !== 'entregar') {
      newDraft('entregar', vid, { mode: t ? 'transfer' : 'devolucao' });
      if (t && t.status === 'solicitada') { setTransfer(t, 'aguardando_entrega', 'Condutor atual aceitou a solicitação'); }
      if (t && t.status === 'aguardando_entrega') { setTransfer(t, 'entrega_andamento', 'Checklist de entrega iniciado'); log('transferencia', `${drv(c.driverId).name} iniciou o checklist de entrega`, { vehicleId: vid, driverId: c.driverId }); save(); }
      captureLocation(v);
    }
    const seg = currentSegment(c);
    return `<form class="drv" id="ckform" novalidate>
      <div><p class="label">Checklist completo · ${t ? 'Troca de condutor' : 'Devolução'}</p><h1>Entrega do veículo</h1></div>
      ${t ? `<div class="note">Entrega para <b>${esc(drv(t.toDriverId).name)}</b>. Após este checklist sua posse é encerrada e ${esc(drv(t.toDriverId).name.split(' ')[0])} poderá fazer o recebimento.</div>` : `<div class="note">Devolução do veículo. Após este checklist sua posse é encerrada e o veículo fica disponível.</div>`}
      ${ckHeader(v, `<dt>Obra atual</dt><dd>${seg ? projLabel(seg.projectId) : projLabel(null)}</dd><dt>Posse desde</dt><dd>${fmtDT(c.start)}</dd><dt>Km inicial</dt><dd class="num">${km(c.startKm)}</dd>`)}
      ${fullChecklistBody(v)}
      <div class="note bad" id="ck-err" hidden role="alert"></div>
      <div class="sticky-foot"><button type="button" class="btn lg" data-go="inicio">Depois</button><button class="btn ok lg" style="flex:1">Concluir entrega</button></div>
    </form>`;
  },
  mount({ vid, tid }) {
    const f = $('#ckform'); if (!f) return; bindDraft(f);
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = veh(DRAFT.vid); const c = activeCustody(v.id); const t = tid ? byId(S.transfers, tid) : activeTransfer(v.id);
      const { e: errs, km: k } = validateFull(v); if (errs.length) return showErrors(errs);
      const ck = saveFullChecklist(t ? 'entrega' : 'devolucao', v, c.driverId, c.id, k);
      c.end = nowTs() + 1; c.endKm = k; c.deliverChecklistId = ck.id; c.closedReason = t ? 'transferencia' : 'entrega'; c.transferId = t?.id || null;
      log('posse_fim', `${drv(c.driverId).name} entregou o veículo. Posse encerrada (${nf(k - c.startKm)} km rodados)`, { vehicleId: v.id, driverId: c.driverId, at: nowTs() + 1 });
      if (t) {
        t.deliverChecklistId = ck.id; setTransfer(t, 'aguardando_recebimento', 'Checklist de entrega aprovado; posse anterior encerrada');
        notify(t.toDriverId, `${drv(c.driverId).name} entregou o ${v.plate}. Faça o checklist de recebimento para assumir a posse.`, { level: 'ok', link: { page: 'inicio' } });
      }
      save(); toast(t ? `Entrega concluída. Aguardando recebimento de ${drv(t.toDriverId).name}.` : 'Veículo devolvido. Posse encerrada.'); go('inicio');
    });
  }
};

      </div></div>` : ''}
      ${nao ? `<div class="panel"><div class="panel-h"><h3>Descreva o problema</h3></div><div class="panel-b stack" style="gap:14px">${problemFields()}</div></div>` : ''}
      <div class="note bad" id="ck-err" hidden role="alert"></div>

    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = veh(DRAFT.vid); const c = activeCustody(v.id); const D = DRAFT; const errs = [];
      const k = parseInt(String(D.km).replace(/\D/g, ''), 10);
      if (!k && !D.photos.painel_d) errs.push('Informe a quilometragem ou envie a foto do painel.');
      if (k && k < lastRecordedKm(v.id)) errs.push(`A quilometragem não pode ser menor que o último registro (${km(lastRecordedKm(v.id))}).`);
      if (D.answer === 'sim' && (D.projOk === '0' || !currentSegment(c)) && !D.projectId) errs.push('Selecione a obra.');
      if (D.answer === 'nao') errs.push(...problemErrors());
      if (errs.length) return showErrors(errs);
      const kmv = k || suggestedKm(v);
      const [h, m] = S.settings.dailyDeadline.split(':').map(Number); const n = new Date();
      const ck = { id: uid('ck'), type: 'diario', vehicleId: v.id, driverId: c.driverId, userId: CUR.id, custodyId: c.id, at: nowTs(), km: kmv, ok: D.answer === 'sim', problem: null, photos: { painel: D.photos.painel_d || null }, location: D.geo, late: n.getHours() * 60 + n.getMinutes() > h * 60 + m };
      S.checklists.push(ck); v.odometer = Math.max(v.odometer, kmv);
      if (D.answer === 'sim') {
        log('checklist', `Checklist diário: condições normais (${nf(kmv)} km)${ck.late ? ' · fora do prazo' : ''}`, { vehicleId: v.id, driverId: c.driverId });
        const seg = currentSegment(c);
        if ((D.projOk === '0' || !seg) && D.projectId && D.projectId !== seg?.projectId) changeProject(c, D.projectId, prj(D.projectId).ccId, seg?.purpose || PURPOSES[0]);
        save(); toast('Checklist diário concluído.'); go('inicio');
      } else {
        const iss = createIssue(v, c.driverId, 'diario');
        ck.problem = { issueId: iss.id };
        log('checklist', `Checklist diário: veículo com problema (${nf(kmv)} km)`, { vehicleId: v.id, driverId: c.driverId });
        save(); toast(iss.severity === 'critica' ? 'Problema crítico registrado. A gestão foi alertada.' : 'Checklist registrado com o problema informado.'); go('inicio');
      }
    });
  }
};
ACTIONS['d-ans'] = a => { DRAFT.answer = a.dataset.v; go('diario', { vid: DRAFT.vid }, { keepDraft: true, noPush: true }); };

function problemFields() {
  const D = DRAFT;
  return `<div class="field"><span>Tipo de problema</span><div class="seg">${PROBLEM_TYPES.map(t => `<label><input type="radio" name="type" value="${t}" ${D.type === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></div>
    <label class="field"><span>Descrição</span><textarea class="inp" name="desc" placeholder="O que aconteceu? Onde está o problema?">${esc(D.desc)}</textarea></label>
    <div class="field"><span>Criticidade</span><div class="seg">${Object.entries(SEVERITY).map(([k, s]) => `<label><input type="radio" name="severity" value="${k}" ${D.severity === k ? 'checked' : ''}><span>${s.l}</span></label>`).join('')}</div><small>Crítica gera alerta imediato para o gestor.</small></div>
    ${singlePhoto('problema', 'Foto do problema')}
    <div class="field"><span>O veículo pode continuar circulando?</span><div class="seg bad"><label><input type="radio" name="canRun" value="1" ${D.canRun === '1' ? 'checked' : ''}><span>Sim</span></label><label><input type="radio" name="canRun" value="0" ${D.canRun === '0' ? 'checked' : ''}><span>Não, veículo parado</span></label></div></div>`;
}
function problemErrors() {
  const e = []; const D = DRAFT;
  if (!D.type) e.push('Selecione o tipo de problema.');
  if (!D.desc || D.desc.length < 5) e.push('Descreva o problema.');
  if (!D.severity) e.push('Informe a criticidade.');
  if (!D.canRun) e.push('Informe se o veículo pode continuar circulando.');
  return e;
}
function createIssue(v, driverId, source) {
  const D = DRAFT;
  const iss = { id: uid('iss'), vehicleId: v.id, driverId, at: nowTs(), type: D.type, desc: D.desc, severity: D.severity, canRun: D.canRun === '1', photo: D.photos.problema || null, status: 'aberta', source, location: D.geo };
  S.issues.push(iss);
  log('problema', `Problema ${SEVERITY[iss.severity].l.toLowerCase()} informado: ${iss.type} – ${iss.desc}${iss.canRun ? '' : '. Veículo não pode circular'}`, { vehicleId: v.id, driverId });
  if (iss.severity === 'critica' || !iss.canRun) notify('gestao', `Problema ${iss.severity === 'critica' ? 'CRÍTICO' : SEVERITY[iss.severity].l.toLowerCase()} no ${v.plate} (${iss.type})${iss.canRun ? '' : ': veículo não pode circular'}. Informado por ${drv(driverId)?.name || CUR.name}.`, { level: 'bad', link: { page: 'veiculo', id: v.id } });
  return iss;
}

    return `<form class="${wrap}" id="fform" novalidate>

        <div class="field full"><span>Combustível</span><div class="seg">${types.map(t => `<label><input type="radio" name="fuelType" value="${t}" ${DRAFT.fuelType === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></div>
        <label class="field full"><span>Posto</span><input class="inp" name="station" list="stations" value="${esc(DRAFT.station)}" placeholder="Nome do posto"><datalist id="stations">${stations.map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
        <div class="full">${singlePhoto('cupom', 'Foto do cupom ou nota fiscal')}</div>
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Cálculo automático</h3></div><div class="panel-b" id="fuel-calc"></div></div>
      <div class="note bad" id="ck-err" hidden role="alert"></div>
      <div class="sticky-foot"><button class="btn ok lg block">Registrar abastecimento</button></div>
    </form>`;
  },
  mount() {
    const f = $('#fform'); if (!f) return; bindDraft(f);
    const num = s => parseFloat(String(s || '').replace(/\./g, '').replace(',', '.'));
    const calc = () => {
      const v = veh(DRAFT.vid); const k = parseInt(String(DRAFT.km).replace(/\D/g, ''), 10); const l = num(DRAFT.liters); const t = num(DRAFT.total);
      const prev = S.fuel.filter(x => x.vehicleId === v.id).sort((a, b) => b.at - a.at)[0];
      const avg = vehicleAvgKmL(v.id);
      let html = `<dl class="dl"><dt>Média do veículo</dt><dd class="num">${nf(avg, 1)} km/l</dd>`;
      if (prev) html += `<dt>Último abastecimento</dt><dd class="num">${km(prev.km)} · ${fmtShort(prev.at)}</dd>`;
      if (k && l && prev && k > prev.km) {
        const dist = k - prev.km, kml = dist / l, dev = (kml - avg) / avg * 100;
        const out = Math.abs(dev) > S.settings.fuelDeviationPct;
        html += `<dt>Distância</dt><dd class="num">${km(dist)}</dd><dt>Consumo</dt><dd class="num"><b>${nf(kml, 1)} km/l</b> ${out ? pill(`${dev > 0 ? '+' : ''}${nf(dev, 0)}% da média`, 'warn') : `<span class="muted">${dev > 0 ? '+' : ''}${nf(dev, 0)}% da média</span>`}</dd>`;
        if (t) html += `<dt>Custo por km</dt><dd class="num">${money(t / dist)}</dd>`;
      }
      if (l && t) html += `<dt>Preço por litro</dt><dd class="num">${money(t / l)}</dd>`;
      $('#fuel-calc').innerHTML = html + '</dl>';
    };
    DRAFT._onChange = calc; calc();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = veh(DRAFT.vid); const c = activeCustody(v.id); const errs = [];
      const k = parseInt(String(DRAFT.km).replace(/\D/g, ''), 10); const l = num(DRAFT.liters); const t = num(DRAFT.total);
      if (!k) errs.push('Informe a quilometragem.'); else if (k < lastRecordedKm(v.id)) errs.push(`A quilometragem não pode ser menor que o último registro (${km(lastRecordedKm(v.id))}).`);
      if (!l || l <= 0) errs.push('Informe os litros.'); if (!t || t <= 0) errs.push('Informe o valor total.');
      if (!DRAFT.station) errs.push('Informe o posto.'); if (!DRAFT.photos.cupom) errs.push('Envie a foto do cupom ou nota fiscal.');
      if (errs.length) return showErrors(errs);
      const seg = currentSegment(c);
      const rec = { id: uid('fuel'), vehicleId: v.id, driverId: c.driverId, custodyId: c.id, projectId: seg?.projectId || null, at: nowTs(), km: k, liters: l, total: t, fuelType: DRAFT.fuelType, station: DRAFT.station, receipt: DRAFT.photos.cupom, location: DRAFT.geo };
      S.fuel.push(rec); v.odometer = Math.max(v.odometer, k);
      log('abastecimento', `Abastecimento: ${nf(l, 1)} L, ${money(t)} em ${rec.station}`, { vehicleId: v.id, driverId: c.driverId });
      const m = fuelOutlier(rec);
      if (m) notify('gestao', `Consumo fora do padrão no ${v.plate}: ${nf(m.kmL, 1)} km/l (${m.delta > 0 ? '+' : ''}${nf(m.delta, 0)}% da média).`, { level: 'warn', link: { page: 'abastecimento' } });
      save(); toast('Abastecimento registrado.'); go(CUR.role === 'condutor' ? 'inicio' : 'abastecimento');
    });
  }
};

  return `<div class="steps">${T_STATUS.map(([k, l], i) => `<div class="step ${i < cur || (t?.status === 'concluida') ? 'done' : ''} ${i === cur && t?.status !== 'concluida' ? 'cur' : ''}">${l}</div>`).join('')}</div>`;
}

/* ===================== Mapa (Leaflet + base vetorial real) ===================== */
let MAPS = [];
function destroyMaps() { MAPS.forEach(m => { try { m.remove(); } catch (e) { } }); MAPS = []; }
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const statusHex = c => ({ ok: cssVar('--green'), neu: cssVar('--blue'), warn: cssVar('--yellow'), urg: cssVar('--orange'), bad: cssVar('--red'), gray: cssVar('--text3') }[c] || cssVar('--text3'));
const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark';
function buildMap(el, vehicles, opts = {}) {
  if (!el) return null;
  if (!window.L) { el.innerHTML = '<div class="empty">Mapa indisponível: a biblioteca de mapas não carregou.</div>'; return null; }
  const map = L.map(el, { scrollWheelZoom: false, zoomSnap: .5, fadeAnimation: false, zoomAnimation: true, attributionControl: true, minZoom: 9, maxZoom: 18 });
  MAPS.push(map);
  map.createPane('vbase').style.zIndex = 150;
  map.createPane('vlabel').style.zIndex = 160;
  const BM = window.BASEMAP;
  if (BM) {
    L.geoJSON(BM.mun, { pane: 'vbase', interactive: false, style: { color: cssVar('--map-line'), weight: 1, fillColor: cssVar('--map-mun'), fillOpacity: 1 } }).addTo(map);
    L.geoJSON(BM.urban, { pane: 'vbase', interactive: false, style: { stroke: false, fillColor: cssVar('--map-urban'), fillOpacity: 1 } }).addTo(map);
    L.geoJSON(BM.roads, { pane: 'vbase', interactive: false, style: { color: cssVar('--map-road-case'), weight: 6, opacity: 1 } }).addTo(map);
    L.geoJSON(BM.roads, { pane: 'vbase', interactive: false, style: { color: cssVar('--map-road'), weight: 3.5, opacity: 1 } }).addTo(map);
    BM.mun.features.forEach(f => L.marker(f.properties.c, { pane: 'vlabel', interactive: false, icon: L.divIcon({ className: '', html: `<div class="mlabel">${esc(f.properties.n)}</div>`, iconSize: [0, 0] }) }).addTo(map));
  }
  // ruas reais quando a rede permite (Hostinger); no visualizador fica a base vetorial acima
  const tl = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${isDark() ? 'dark_all' : 'light_all'}/{z}/{x}/{y}{r}.png`, { subdomains: 'abcd', maxZoom: 19, attribution: '© OpenStreetMap · © CARTO' });
  let failed = 0;
  tl.on('tileerror', () => { if (++failed === 1) { map.removeLayer(tl); map.attributionControl.addAttribution('Base: IBGE · Natural Earth'); } });
  tl.addTo(map);
  const pts = [];
  if (opts.projects !== false) S.projects.filter(p => p.active).forEach(p => {
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="ppin"></div><div class="mlabel proj">${esc(p.code)}</div>`, iconSize: [0, 0] }) }).bindTooltip(`${esc(p.code)} · ${esc(p.name)}`).addTo(map);
    if (!opts.fitVehiclesOnly) pts.push([p.lat, p.lng]);
  });
  map._vm = {};
  vehicles.forEach(v => {
    const loc = lastLocation(v.id); if (!loc) return;
    const st = vStatus(v);
    const m = L.marker([loc.lat, loc.lng], { riseOnHover: true, zIndexOffset: 1000, icon: vehicleIcon(v, st) });
    m._st = st; m.bindPopup(() => vehiclePopup(v, lastLocation(v.id)));
    m.addTo(map); pts.push([loc.lat, loc.lng]); map._vm[v.id] = m;
  });
  if (pts.length > 1) map.fitBounds(pts, { padding: [36, 36], maxZoom: opts.maxZoom || 12, animate: false });
  else if (pts.length === 1) map.setView(pts[0], opts.zoom || 13, { animate: false });
  else map.setView([-22.9, -47.06], 11, { animate: false });
  setTimeout(() => { if (MAPS.includes(map)) map.invalidateSize({ animate: false }); }, 60);
  return map;
}
const vehicleIcon = (v, st) => L.divIcon({ className: '', html: `<div class="vpin"><i style="background:${statusHex(V_STATUS[st].c)}"></i><b>${v.plate}</b></div>`, iconSize: [0, 0] });
function vehiclePopup(v, loc) {
  const st = vStatus(v); const c = activeCustody(v.id); const seg = currentSegment(c); const t = S.locations[v.id];
  return `<div class="map-pop"><b>${v.plate}</b> · ${esc(v.model)}<br>${stTag(st)}<br>${c ? `${esc(drv(c.driverId).name)} · ${seg ? esc(prj(seg.projectId).code) : 'sem obra'}<br>` : ''}<span class="muted">${esc(loc.what)} · ${fmtShort(loc.at)}</span>${t?.source === 'traccar' && v.tracker ? `<br><span class="muted">Hodômetro ${nf(v.odometer)} km · ignição ${t.ignition ? 'ligada' : 'desligada'}</span>` : ''}<br><button class="link" data-go="veiculo" data-id="${v.id}">Abrir veículo</button></div>`;

/* ---------- Transferência forçada ---------- */
PAGES.forcar = {
  title: 'Transferência forçada',
  render({ vid }) {
    if (!isManager()) return '<div class="note bad">Exclusivo para gestores.</div>';
    const v = veh(vid); const c = activeCustody(vid);
    if (!c) return `<div class="note">O veículo ${plate(v.plate)} não possui posse ativa.</div>`;
    return `<form class="stack" id="fform" style="max-width:720px">
        <div class="panel"><div class="panel-b row" style="padding-top:16px;gap:14px">${plate(v.plate, true)}<div class="person"><span class="avatar lg">${initials(drv(c.driverId).name)}</span><div><b>${esc(drv(c.driverId).name)}</b><small>desde ${fmtDT(c.start)} · ${projLabel(currentSegment(c)?.projectId)}</small></div></div></div></div>
        <div class="note warn">${ic('alert')}<div>Ação administrativa: fica registrada com seu nome e a justificativa.</div></div>
        <div class="panel"><div class="panel-b form-grid" style="padding-top:16px">
          <label class="field"><span>Novo condutor</span><select class="inp" name="to"><option value="">Nenhum — devolver ao pátio</option>${driverOptions('', d => d.id !== c.driverId && driverActive(d))}</select><small>Ele fará o checklist de recebimento para assumir.</small></label>
          <label class="field"><span>Quilometragem</span><input class="inp num" name="km" inputmode="numeric" value="${suggestedKm(v)}"></label>
          <label class="field full"><span>Justificativa</span><textarea class="inp" name="just" placeholder="Por que a entrega não foi feita pelo condutor?"></textarea></label>
        </div></div>
        <div class="note bad" id="ck-err" hidden></div>
        <div class="row"><button type="button" class="btn" data-go="veiculo" data-id="${vid}">Cancelar</button><button class="btn ok">Confirmar transferência</button></div>
      </form>`;
  },
  mount({ vid }) {
    const f = $('#fform'); if (!f) return;
    f.addEventListener('submit', e => {
      e.preventDefault(); const d = formData(f); const v = veh(vid); const c = activeCustody(vid);
      const k = parseInt(d.km.replace(/\D/g, ''), 10); const errs = [];
      if (d.just.length < 15) errs.push('Escreva uma justificativa com pelo menos 15 caracteres.');
      if (!k || k < c.startKm) errs.push('Quilometragem inválida.');
      if (d.to && S.settings.oneVehiclePerDriver && driverCustodies(d.to).length) errs.push(`${drv(d.to).name} já está com outro veículo.`);
      if (errs.length) return showErrors(errs);
      const old = activeTransfer(vid); if (old) setTransfer(old, 'cancelada', 'Substituída por transferência forçada');
      c.end = nowTs(); c.endKm = k; c.closedReason = 'forcada'; v.odometer = Math.max(v.odometer, k);
      log('transferencia_forcada', `Transferência forçada por ${CUR.name}: posse de ${drv(c.driverId).name} encerrada${d.to ? `, liberada para ${drv(d.to).name}` : ''}. Justificativa: ${d.just}`, { vehicleId: vid, driverId: c.driverId });
      notify(c.driverId, `Sua posse do ${v.plate} foi encerrada pela gestão (${CUR.name}).`, { level: 'warn' });
      if (d.to) {
        const t = { id: uid('trf'), vehicleId: vid, fromDriverId: c.driverId, toDriverId: d.to, status: 'aguardando_recebimento', requestedAt: nowTs(), forced: true, justification: d.just, requestedBy: CUR.id, fromCustodyId: c.id, toCustodyId: null, deliverChecklistId: null, receiveChecklistId: null, events: [{ at: nowTs(), status: 'aguardando_recebimento', by: CUR.id, note: `Transferência forçada: ${d.just}` }] };
        S.transfers.push(t); c.transferId = t.id;
        notify(d.to, `A gestão liberou o ${v.plate} para você. Faça o checklist de recebimento.`, { level: 'ok', link: { page: 'inicio' } });
      }
      save(); toast('Transferência forçada registrada.'); go('veiculo', { id: vid });
    });
  }
};

ACTIONS['drv-edit'] = a => openModal({ title: 'Editar condutor', body: driverForm(drv(a.dataset.id)), foot: `<button class="btn" data-act="modal-close">Cancelar</button><button class="btn ok" data-act="drv-save" data-id="${a.dataset.id}">Salvar</button>` });
ACTIONS['drv-save'] = a => {
  const d = formData($('#dform-cad')); const err = t => $('#df-err').textContent = t; const edit = a.dataset.id ? drv(a.dataset.id) : null;
  if (d.name.split(' ').filter(Boolean).length < 2) return err('Informe nome e sobrenome.');
  if (!/^\d{9,11}$/.test(d.cnh.replace(/\D/g, ''))) return err('Número da CNH inválido.');
  if (!d.cnhExp) return err('Informe a validade da CNH.');
  if (parseDate(d.cnhExp) < startOfDay(nowTs())) return err('A CNH está vencida. Cadastre com uma CNH válida.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return err('Informe um e-mail válido para o acesso ao aplicativo.');
  const other = S.users.find(u => u.email.toLowerCase() === d.email.toLowerCase() && u.driverId !== edit?.id);
  if (other) return err('Este e-mail já está em uso por outro usuário.');
  const fields = { name: d.name, cnh: d.cnh.replace(/\D/g, ''), cnhCat: d.cnhCat, cnhExp: parseDate(d.cnhExp), phone: d.phone };
  if (edit) {
    Object.assign(edit, fields); const u = S.users.find(x => x.driverId === edit.id); if (u) { u.name = d.name; u.email = d.email; }
    log('cadastro', `Cadastro do condutor ${edit.name} atualizado por ${CUR.name}`, { driverId: edit.id }); save(); closeModal(); toast('Condutor atualizado.');
    if (APP_MODE === 'cloud') cloudDriverAccess(edit, d.email, false).then(render);
    return render();
  }
  const id = uid('drv');
  S.drivers.push({ id, ...fields, active: true, telemetry: { avarias: 0, harsh: 0, speeding: 0 }, createdAt: nowTs() });
  if (APP_MODE !== 'cloud') S.users.push({ id: 'u_' + id, name: d.name, role: 'condutor', driverId: id, email: d.email, active: true });
  log('cadastro', `Condutor ${d.name} cadastrado por ${CUR.name}`, { driverId: id });

ACTIONS['drv-toggle'] = a => {

    const tabs = [['posses', 'Posses'], ['score', 'Pontuação'], ['ck', 'Checklists'], ['fuel', 'Abastecimentos'], ['multas', 'Multas'], ['ocor', 'Ocorrências'], ['tl', 'Histórico']];

/* ===================== Calendário de manutenção e locação ===================== */
const LVL_CLASS = { normal: 'neu', atencao: 'warn', urgente: 'urg', vencido: 'bad' };
function calEvents(from, to, vid) {
  const today = startOfDay(nowTs()); const ev = [];
  S.vehicles.filter(v => v.active && (!vid || v.id === vid)).forEach(v => {
    S.plans.filter(p => p.vehicleId === v.id).forEach(p => {
      const d = planDue(p); if (d.date == null) return;
      const date = Math.max(d.date, today);
      if (date >= from && date < to) ev.push({ date, kind: 'mnt', c: LVL_CLASS[d.lvl], lvl: d.lvl, label: p.item, plate: v.plate, vid: v.id, planId: p.id, d });
    });
    if (v.ownership === 'locada' && v.rental?.status === 'ativa') {
      const date = Math.max(startOfDay(v.rental.dueDate), today); const rs = rentalState(v);
      if (date >= from && date < to) ev.push({ date, kind: 'rent', c: rs.lvl === 'normal' ? 'rent' : LVL_CLASS[rs.lvl], lvl: rs.lvl, label: 'Devolver ou renovar', plate: v.plate, vid: v.id, rs });
    }
  });
  S.maintRecords.filter(r => (!vid || r.vehicleId === vid) && r.at >= from && r.at < to).forEach(r => ev.push({ date: startOfDay(r.at), kind: 'done', c: 'ok', lvl: 'ok', label: r.items.join(', '), plate: veh(r.vehicleId).plate, vid: r.vehicleId, rec: r }));
  ev.push(...docCalEvents(from, to, vid));
  return ev.sort((a, b) => a.date - b.date || (M_LEVEL[b.lvl]?.r || 0) - (M_LEVEL[a.lvl]?.r || 0));
}
function upcomingEvents(days) { const t = startOfDay(nowTs()); return calEvents(t, t + days * DAY).filter(e => e.kind !== 'done'); }

    const start = first - base.getDay() * DAY; const days = Math.ceil((next.getTime() - start) / DAY / 7) * 7;

    </div>`;
