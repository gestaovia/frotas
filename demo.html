const PLAN_ITEMS = ['Troca de óleo', 'Filtros', 'Alinhamento', 'Balanceamento', 'Pneus', 'Revisão', 'Correia dentada', 'Freios', 'Bateria'];
function planEditor(v) {
  const M = isManager(); const items = [...new Set([...PLAN_ITEMS, ...S.plans.filter(p => p.vehicleId === v.id).map(p => p.item)])];
  const rows = items.map(it => {
    const p = S.plans.find(x => x.vehicleId === v.id && x.item === it); const d = p ? planDue(p) : null;
    const dis = M ? '' : 'disabled';
    return `<tr data-item="${esc(it)}" class="${p ? 'sev ' + (M_LEVEL[d.lvl].c === 'gray' ? '' : M_LEVEL[d.lvl].c) : ''}">
      <td><label class="toggle"><input type="checkbox" class="pe-on" ${p ? 'checked' : ''} ${dis} aria-label="Controlar ${esc(it)}"><i></i></label></td><td class="nowrap"><b>${esc(it)}</b></td>
      <td><input class="inp num pe-km" value="${p?.everyKm ?? ''}" placeholder="km" inputmode="numeric" style="width:96px;min-height:34px" ${dis}></td>
      <td><input class="inp num pe-days" value="${p?.everyDays ?? ''}" placeholder="dias" inputmode="numeric" style="width:76px;min-height:34px" ${dis}></td>
      <td><input class="inp num pe-lkm" value="${p?.lastKm ?? ''}" placeholder="${v.odometer}" inputmode="numeric" style="width:96px;min-height:34px" ${dis}></td>
      <td><input class="inp pe-ldate" type="date" value="${p?.lastDate ? dateInput(p.lastDate) : ''}" style="width:142px;min-height:34px" ${dis}></td>
      <td class="nowrap small">${d ? `${d.remKm != null ? `<b class="num">${d.remKm > 0 ? nf(d.remKm) + ' km' : 'vencida'}</b><br>` : ''}<span class="muted">${fmtDate(d.date)}</span>` : '<span class="muted">—</span>'}</td>
      <td>${d ? mLvl(d.lvl) : ''}</td></tr>`;
  });
  return `<div class="tbl-wrap"><table class="tbl" id="plan-tbl"><thead><tr><th></th><th>Item</th><th>A cada (km)</th><th>A cada (dias)</th><th>Última troca (km)</th><th>Última troca (data)</th><th>Próxima</th><th>Situação</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    ${M ? `<div class="panel-b row" style="justify-content:space-between;padding-top:12px"><span class="small muted">Em branco, a última troca assume o km atual e a data de hoje. Vence no que ocorrer primeiro.</span><div class="row"><span class="err" id="pe-err"></span><button class="btn ok" data-act="plan-save" data-id="${v.id}">Salvar plano</button></div></div>` : ''}`;
}
function mountPlanEditor() {
  $$('#plan-tbl tr[data-item]').forEach(tr => tr.querySelectorAll('.pe-km,.pe-days').forEach(i => i.addEventListener('input', () => { if (i.value) tr.querySelector('.pe-on').checked = true; })));
}
PAGES.veiculo._mountPlan = () => mountPlanEditor();
ACTIONS['plan-save'] = a => {
  const v = veh(a.dataset.id); const n = x => x ? parseInt(String(x).replace(/\D/g, ''), 10) : null; let changed = 0;
  for (const tr of $$('#plan-tbl tr[data-item]')) {
    const it = tr.dataset.item; const on = tr.querySelector('.pe-on').checked; const p = S.plans.find(x => x.vehicleId === v.id && x.item === it);
    const everyKm = n(tr.querySelector('.pe-km').value), everyDays = n(tr.querySelector('.pe-days').value);
    if (!on) { if (p) { S.plans = S.plans.filter(x => x !== p); changed++; } continue; }
    if (!everyKm && !everyDays) { $('#pe-err').textContent = `${it}: informe km, dias ou ambos.`; return; }
    const lastKm = n(tr.querySelector('.pe-lkm').value) ?? (p?.lastKm ?? v.odometer);
    const lastDate = parseDate(tr.querySelector('.pe-ldate').value) || p?.lastDate || startOfDay(nowTs());
    if (lastKm > v.odometer) { $('#pe-err').textContent = `${it}: última troca acima do km atual.`; return; }
    const vals = { everyKm, everyDays, lastKm, lastDate };
    if (p) { if (JSON.stringify([p.everyKm, p.everyDays, p.lastKm, p.lastDate]) !== JSON.stringify([everyKm, everyDays, lastKm, lastDate])) { Object.assign(p, vals); changed++; } }
    else { S.plans.push({ id: uid('mp'), vehicleId: v.id, item: it, ...vals }); changed++; }
  }
  log('manutencao', `Plano de manutenção atualizado por ${CUR.name} (${changed} item(ns))`, { vehicleId: v.id });
  save(); toast('Plano salvo. Calendário atualizado.'); render();
};

/* ===================== Integração Traccar (rastreamento) =====================
   Servidor real: REST /api/* com "Authorization: Bearer <token>" e WebSocket /api/socket?token=<token>.
   Requer web.origin no traccar.xml apontando para o domínio do gestaovia (CORS).
   Simulador: gera devices/positions/events no mesmo formato JSON do Traccar 6.x. */
const KNOT = 1.852;
const ALARM_LABEL = { overspeed: 'Excesso de velocidade', hardBraking: 'Frenagem brusca', hardAcceleration: 'Aceleração brusca', hardCornering: 'Curva brusca', sos: 'Botão de pânico', powerCut: 'Rastreador desligado da bateria', tampering: 'Violação do rastreador' };

const TC = {
  state: 'off',        // off | connecting | live | polling | error
  msg: '', devices: [], lastMsg: 0, ws: null, timer: null, sim: null, routes: {},
  cfg() { return S.settings.traccar; },
  vehicleOfDevice(deviceId) { return S.vehicles.find(v => v.traccarId === deviceId) || null; },

  /* ---------- servidor real ---------- */
  async req(path, params) {
    if (APP_MODE === 'cloud') return CLOUD.fn('traccar-proxy', { action: path === '/devices' ? 'devices' : 'positions', ...(params || {}) });
    const c = this.cfg(); const base = c.url.replace(/\/+$/, '');
    const q = params ? '?' + new URLSearchParams(params).toString() : '';
    const r = await fetch(`${base}/api${path}${q}`, { headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/json' } });
    if (r.status === 401) throw new Error('Token recusado pelo Traccar (401). Gere um novo token em Configurações › Preferências › Token.');
    if (!r.ok) throw new Error(`Traccar respondeu ${r.status}.`);
    return r.json();
  },
  async start() {
    this.stop();
    const c = this.cfg(); if (!c || c.mode === 'off') { this.state = 'off'; return; }
    if (c.mode === 'simulador' && APP_MODE !== 'cloud') return this.startSim();
    if (APP_MODE === 'cloud') {
      if (!CLOUD.on || CUR?.role === 'condutor' || c.mode !== 'servidor') { this.state = 'off'; return; }
      try { this.server = await CLOUD.rpc('traccar_status'); } catch (e) { this.server = null; }
      if (!this.server?.hasToken || !this.server?.url) { this.state = 'error'; this.msg = 'O administrador ainda não informou o servidor e o token.'; return; }
    } else if (!c.url || !c.token) { this.state = 'error'; this.msg = 'Informe o endereço do servidor e o token.'; return; }
    this.state = 'connecting'; this.msg = 'Conectando…'; this.paint();
    try {
      this.devices = await this.req('/devices');
      this.applyDevices(this.devices);
      this.applyPositions(await this.req('/positions'));
      if (c.live && APP_MODE !== 'cloud') this.openSocket(); else this.startPolling(APP_MODE === 'cloud' ? `Pelo servidor do gestaovia, a cada ${c.pollSec} s` : undefined);
    } catch (e) {
      this.state = 'error';
      this.msg = e instanceof TypeError ? 'Não foi possível alcançar o servidor. Confira o endereço (https), o web.origin no traccar.xml e se a rede permite a conexão.' : e.message;

  },
  openSocket() {
    const c = this.cfg(); const url = c.url.replace(/\/+$/, '').replace(/^http/, 'ws') + '/api/socket?token=' + encodeURIComponent(c.token);
    try {
      const ws = new WebSocket(url); this.ws = ws;
      ws.onopen = () => { this.state = 'live'; this.msg = 'Tempo real (WebSocket)'; this.paint(); };
      ws.onmessage = ev => { try { this.onData(JSON.parse(ev.data)); } catch (e) { } };
      ws.onerror = () => { if (this.ws === ws) { this.ws = null; this.startPolling('WebSocket indisponível; usando consulta periódica.'); } };
      ws.onclose = () => { if (this.ws === ws && this.state === 'live') { this.ws = null; this.startPolling('Conexão em tempo real caiu; usando consulta periódica.'); } };
    } catch (e) { this.startPolling('WebSocket indisponível; usando consulta periódica.'); }
  },
  startPolling(note) {
    clearInterval(this.timer); const c = this.cfg();
    this.state = 'polling'; this.msg = note || `Consulta a cada ${c.pollSec} s`; this.paint();
    this.timer = setInterval(async () => { try { this.applyPositions(await this.req('/positions')); } catch (e) { this.state = 'error'; this.msg = e.message; this.paint(); } }, Math.max(10, c.pollSec) * 1000);
  },
  stop() { clearInterval(this.timer); this.timer = null; if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch (e) { } } clearInterval(this.sim); this.sim = null; },
  async testConnection(url, token) {

    const r = await fetch(`${base}/api/session?token=${encodeURIComponent(token)}`, { credentials: 'omit' });
    if (!r.ok) throw new Error(r.status === 404 || r.status === 401 ? 'Token inválido para este servidor.' : `Traccar respondeu ${r.status}.`);
    const user = await r.json();

  },
  async route(vid, from, to) {
    const v = veh(vid); if (!v?.traccarId) return [];
    const key = `${vid}:${startOfDay(from)}`;
    if (this.cfg().mode === 'simulador') return this.simRoute(v, from, to);
    if (this.routes[key] && nowTs() - this.routes[key].at < 60000) return this.routes[key].pts;
    try { const pts = await this.req('/positions', { deviceId: v.traccarId, from: new Date(from).toISOString(), to: new Date(to).toISOString() }); this.routes[key] = { at: nowTs(), pts }; return pts; }

  },

  /* ---------- aplicação dos dados (mesmo formato do Traccar) ---------- */
  onData(d) {
    this.lastMsg = nowTs();

    if (d.positions) this.applyPositions(d.positions);

  },
  applyDevices(list) {
    list.forEach(dv => { const i = this.devices.findIndex(x => x.id === dv.id); if (i >= 0) this.devices[i] = dv; else this.devices.push(dv); });
    // vínculo automático: nome do dispositivo igual à placa
    this.devices.forEach(dv => { const v = S.vehicles.find(x => !x.traccarId && x.plate === String(dv.name || '').toUpperCase().replace(/[^A-Z0-9]/g, '')); if (v) { v.traccarId = dv.id; v.traccarUniqueId = dv.uniqueId; v.tracker = true; } });

  applyPositions(list) {

      const a = p.attributes || {};

      S.locations[v.id] = { lat: p.latitude, lng: p.longitude, speed: Math.round((p.speed || 0) * KNOT), course: p.course, ignition: a.ignition ?? (p.speed > 1), motion: a.motion, km: km ? Math.round(km) : v.odometer, at, address: p.address || '', source: 'traccar', positionId: p.id };
      if (c.odometer && km && km > v.odometer && km - v.odometer < 5000) v.odometer = Math.round(km);
      if (this.routes[`${v.id}:${startOfDay(at)}`]) this.routes[`${v.id}:${startOfDay(at)}`].pts.push(p);

  },
  applyEvents(list) {
    list.forEach(e => {
      const v = this.vehicleOfDevice(e.deviceId); if (!v) return;
      const at = Date.parse(e.eventTime);
      const kind = e.type === 'alarm' ? (e.attributes?.alarm || 'alarm') : e.type === 'deviceOverspeed' ? 'overspeed' : e.type;
      if (!ALARM_LABEL[kind]) return; // ignora ignição, entrada em cerca etc. neste protótipo
      if (S.trackerEvents.some(x => x.extId === e.id && e.id)) return;
      const c = custodyAt(v.id, at);
      const sp = e.attributes?.speed ? Math.round(e.attributes.speed * KNOT) : S.locations[v.id]?.speed;
      const ev = { id: uid('tev'), extId: e.id || null, vehicleId: v.id, driverId: c?.driverId || null, type: kind, at, speed: sp || null, lat: S.locations[v.id]?.lat, lng: S.locations[v.id]?.lng };
      S.trackerEvents.push(ev);
      log('telemetria', `${ALARM_LABEL[kind]}${sp ? ` (${sp} km/h)` : ''} registrado pelo rastreador`, { vehicleId: v.id, driverId: ev.driverId, at, userId: 'sistema' });
      if (['overspeed', 'sos', 'powerCut', 'tampering'].includes(kind)) notify('gestao', `${v.plate}: ${ALARM_LABEL[kind]}${sp ? ` a ${sp} km/h` : ''}${ev.driverId ? ` · ${drv(ev.driverId).name}` : ''}.`, { level: kind === 'overspeed' ? 'warn' : 'bad', link: { page: 'veiculo', id: v.id } });

  },
  /* atualização visual sem recarregar a página */
  live() {

  },
  paint() { const b = $('#tc-badge'); if (b) b.outerHTML = tcBadge(); const s = $('#tc-status'); if (s) s.outerHTML = tcStatusBox(); },

  /* ---------- simulador (mesmos JSONs do Traccar) ---------- */
  startSim() {
    this.state = 'live'; this.msg = 'Simulador (dados de demonstração)';
    this.devices = S.vehicles.filter(v => v.traccarId).map(v => ({ id: v.traccarId, name: v.plate, uniqueId: v.traccarUniqueId, status: 'online', lastUpdate: new Date().toISOString(), category: 'car', attributes: {} }));
    this.sim = setInterval(() => this.simTick(), 5000);
    this.paint();
  },
  simTick() {
    const positions = [], events = [];
    S.vehicles.filter(v => v.traccarId && v.active).forEach(v => {
      const l = S.locations[v.id]; if (!l) return;
      const c = activeCustody(v.id); const blocked = v.maintenance || openIssues(v.id).some(i => !i.canRun);
      let { lat, lng } = l; let speed = 0; let ign = l.ignition;
      if (c && !blocked) {
        if (!ign && Math.random() < .12) ign = true;
        const seg = currentSegment(c); const tgt = seg ? prj(seg.projectId) : prj('pmat');
        const dLat = tgt.lat - lat, dLng = tgt.lng - lng, dist = Math.hypot(dLat, dLng);
        if (ign && dist > .004) {
          const step = Math.min(dist, .0025 + Math.random() * .003);
          lat += dLat / dist * step + (Math.random() - .5) * .001; lng += dLng / dist * step + (Math.random() - .5) * .001;
          speed = Math.round(40 + Math.random() * 55); if (Math.random() < .04) speed = 104 + Math.round(Math.random() * 18);
        } else if (ign && Math.random() < .35) ign = false;

      if (speed > S.settings.traccar.speedLimit) events.push({ id: pid + 1, type: 'deviceOverspeed', eventTime: new Date().toISOString(), deviceId: v.traccarId, positionId: pid, attributes: { speed: speed / KNOT } });
      else if (speed > 30 && Math.random() < .015) events.push({ id: pid + 2, type: 'alarm', eventTime: new Date().toISOString(), deviceId: v.traccarId, positionId: pid, attributes: { alarm: Math.random() < .5 ? 'hardBraking' : 'hardAcceleration' } });
    });

  },
  simRoute(v, from, to) {
    // trajeto do dia: da matriz até as obras da posse, com a posição atual no final
    const c = custodyAt(v.id, Math.min(to, nowTs())) || activeCustody(v.id); const l = S.locations[v.id]; if (!c || !l) return [];
    const start = Math.max(from, c.start, startOfDay(to) + 7 * 36e5); if (start >= Math.min(to, nowTs())) return [];
    const stops = [prj('pmat'), ...c.segments.filter(s => s.at < to).map(s => prj(s.projectId)).filter(Boolean)].slice(-3);
    const pts = []; const path = [...stops.map(p => [p.lat, p.lng]), [l.lat, l.lng]];

    }
    return pts;
  }
};

/* ---------- mapa ao vivo ---------- */
function liveUpdateMaps() {
  MAPS.forEach(map => {
    Object.entries(map._vm || {}).forEach(([vid, m]) => {
      const v = veh(vid); const loc = lastLocation(vid); if (!loc) return;
      m.setLatLng([loc.lat, loc.lng]);
      const st = vStatus(v); if (m._st !== st) { m._st = st; m.setIcon(vehicleIcon(v, st)); }
      if (m.isPopupOpen()) m.setPopupContent(vehiclePopup(v, loc));
    });
    if (map._route && map._routeVid) { const l = S.locations[map._routeVid]; if (l && l.source === 'traccar') map._route.addLatLng([l.lat, l.lng]); }
  });

function mountTraccarSettings() {

  });
  $$('.tc-map').forEach(s => s.addEventListener('change', () => {

/* ---------- trajeto do dia no detalhe do veículo ---------- */
async function drawTodayRoute(map, vid) {
  if (!map || !window.L) return;
  const pts = await TC.route(vid, startOfDay(nowTs()), nowTs());
  if (!MAPS.includes(map) || pts.length < 2) return;
  const line = L.polyline(pts.map(p => [p.latitude, p.longitude]), { color: cssVar('--blue'), weight: 4, opacity: .75 }).addTo(map);
  L.circleMarker([pts[0].latitude, pts[0].longitude], { radius: 5, color: '#fff', weight: 2, fillColor: cssVar('--green'), fillOpacity: 1 }).bindTooltip(`Início ${fmtTime(Date.parse(pts[0].fixTime))}`).addTo(map);
  map._route = line; map._routeVid = vid;
  map.fitBounds(line.getBounds(), { padding: [20, 20], animate: false, maxZoom: 14 });
  const km = pts.reduce((s, p, i) => i ? s + Math.hypot(p.latitude - pts[i - 1].latitude, (p.longitude - pts[i - 1].longitude) * .92) * 111 : 0, 0);
  const el = $('#route-info'); if (el) el.textContent = `Trajeto de hoje · ${nf(km * 1.2, 0)} km · ${pts.length} posições`;
}

/* ===================== Documentação do veículo: CRLV e IPVA ===================== */
const docSet = () => S.settings.docs || (S.settings.docs = { warnDays: 30, urgentDays: 7 });
const docsOf = v => v.docs || (v.docs = { crlv: [], ipva: [], ipvaByRental: v.ownership === 'locada' });
const crlvCurrent = v => docsOf(v).crlv.slice().sort((a, b) => b.year - a.year)[0] || null;
function dueLevel(due) {
  const days = Math.floor((startOfDay(due) - startOfDay(nowTs())) / DAY); const st = docSet();
  return { days, lvl: days < 0 ? 'vencido' : days <= st.urgentDays ? 'urgente' : days <= st.warnDays ? 'atencao' : 'normal' };
}
// pendências de documentação de um veículo (licenciamento e parcelas de IPVA em aberto)
function docItems(v) {
  const d = docsOf(v); const out = [];
  const c = crlvCurrent(v);
  if (!c) out.push({ kind: 'crlv', label: 'CRLV não cadastrado', due: null, days: null, lvl: 'atencao' });
  else if (c.licDue) out.push({ kind: 'lic', label: `Licenciamento ${c.year + 1}`, due: c.licDue, ...dueLevel(c.licDue), ref: c });
  if (!d.ipvaByRental) {
    d.ipva.forEach(y => y.installments.filter(i => !i.paidAt).forEach(i => out.push({ kind: 'ipva', label: `IPVA ${y.year}${y.installments.length > 1 ? ` · parcela ${i.n}/${y.installments.length}` : ' · cota única'}`, due: i.due, value: i.value, ...dueLevel(i.due), year: y, inst: i })));
    const nextY = new Date().getFullYear() + 1;
    if (new Date().getMonth() === 11 && !d.ipva.some(y => y.year === nextY)) out.push({ kind: 'ipva_new', label: `Registrar IPVA ${nextY}`, due: new Date(nextY, 0, 10).getTime(), ...dueLevel(new Date(nextY, 0, 10).getTime()) });
  }
  return out.sort((a, b) => (a.due ?? 0) - (b.due ?? 0));
}
function docAttention() {
  const out = [];
  S.vehicles.filter(v => v.active).forEach(v => docItems(v).filter(x => x.lvl !== 'normal').forEach(x => {
    const sub = x.due == null ? 'Anexe o documento do veículo' : x.days < 0 ? `Vencido há ${-x.days} dias${x.value ? ' · ' + money(x.value) : ''}` : x.days === 0 ? 'Vence hoje' : `Vence em ${x.days} dias${x.value ? ' · ' + money(x.value) : ''}`;
    out.push({ c: M_LEVEL[x.lvl].c === 'gray' ? 'warn' : M_LEVEL[x.lvl].c, r: x.lvl === 'vencido' ? 8 : x.lvl === 'urgente' ? 5 : 2, icon: 'fine', title: `${v.plate} · ${x.label}`, sub, text: '', at: null, go: { page: 'veiculo', id: v.id, tab: 'docs' } });
  }));
  return out;
}
function docCalEvents(from, to, vid) {
  const ev = []; const today = startOfDay(nowTs());
  S.vehicles.filter(v => v.active && (!vid || v.id === vid)).forEach(v => {
    docItems(v).filter(x => x.due != null).forEach(x => { const date = Math.max(startOfDay(x.due), today); if (date >= from && date < to) ev.push({ date, kind: 'doc', c: x.lvl === 'normal' ? 'rent' : LVL_CLASS[x.lvl], lvl: x.lvl, label: x.label, plate: v.plate, vid: v.id }); });
    docsOf(v).ipva.forEach(y => y.installments.filter(i => i.paidAt && i.paidAt >= from && i.paidAt < to).forEach(i => ev.push({ date: startOfDay(i.paidAt), kind: 'doc', c: 'ok', lvl: 'ok', label: `IPVA ${y.year} pago`, plate: v.plate, vid: v.id })));
  });
  return ev;
}
function docCosts(from, to) {

  S.vehicles.forEach(v => {
    docsOf(v).ipva.forEach(y => y.installments.filter(i => i.paidAt >= from && i.paidAt < to).forEach(i => rows.push({ kind: 'Documentação', value: i.paidValue ?? i.value, vehicleId: v.id, driverId: null, projectId: null })));
    docsOf(v).crlv.filter(c => c.feePaidAt >= from && c.feePaidAt < to && c.fee).forEach(c => rows.push({ kind: 'Documentação', value: c.fee, vehicleId: v.id, driverId: null, projectId: null }));

/* ---------- arquivos ---------- */
function readDocFile(file) {
  return new Promise(async res => {
    if (!file) return res(null);
    if (file.type.startsWith('image/')) return res({ name: file.name, size: file.size, type: file.type, data: await readPhoto(file, 1400) });
    if (file.size <= (APP_MODE === 'cloud' ? 9.5 * 1024 * 1024 : 900 * 1024)) { const fr = new FileReader(); fr.onload = () => res({ name: file.name, size: file.size, type: file.type, data: fr.result }); fr.onerror = () => res({ name: file.name, size: file.size, type: file.type, data: null }); return fr.readAsDataURL(file); }
    res({ name: file.name, size: file.size, type: file.type, data: null, tooBig: true });
  });
}
ACTIONS['doc-file'] = a => {
  const [kind, vid, year, n] = a.dataset.k.split(':'); const d = docsOf(veh(vid));
  const f = kind === 'crlv' ? d.crlv.find(x => x.year === +year)?.file : d.ipva.find(y => y.year === +year)?.installments.find(i => i.n === +n)?.receipt;
  if (!f) return;
  let body;
  if (f.data?.startsWith('sb:')) {
    const url = CLOUD.fileUrl(f.data);
    body = !url ? `<div class="note">${ic('fine')}<div><b>${esc(f.name)}</b><br>O link do arquivo expirou. Recarregue a página.</div></div>`
      : f.type?.startsWith('image/') ? `<img src="${url}" alt="${esc(f.name)}" style="width:100%;border-radius:8px">`
      : `<div class="note">${ic('fine')}<div><b>${esc(f.name)}</b> · ${nf(f.size / 1024)} KB<br><a class="link" href="${url}" target="_blank" rel="noopener">Abrir o arquivo</a> <span class="small muted">(link válido por 1 hora)</span></div></div>`;

function seedDocs(D) {
  const Y = new Date().getFullYear(); const t0 = startOfDay(nowTs());
  const demoFile = (n, v) => ({ name: n, size: 180000 + (v.plate.charCodeAt(0) * 911) % 90000, type: 'application/pdf', data: null, demo: true });
  const lic = { v1: 18, v3: -5, v6: 5 }; // dias até o próximo licenciamento (demonstração)
  D.vehicles.forEach((v, idx) => {
    const locada = v.ownership === 'locada';
    const docs = v.docs = { crlv: [], ipva: [], ipvaByRental: locada };
    const renavam = String(10000000000 + ((idx + 7) * 7349201) % 89999999999).slice(0, 11);
    const due = lic[v.id] != null ? t0 + lic[v.id] * DAY : new Date(Y + 1, 2 + idx % 8, 10 + idx).getTime();
    const cy = lic[v.id] != null ? Y - 1 : Y;
    docs.crlv.push({ year: cy, renavam, issuedAt: new Date(cy, 1 + idx % 6, 5 + idx).getTime(), licDue: due, fee: null, feePaidAt: null, file: demoFile(`CRLV-e_${cy}_${v.plate}.pdf`, v) });
    if (locada) return;
    const val = Math.round((v.year >= 2023 ? 3600 : 2200) + idx * 173);
    const parts = idx % 3 === 0 ? 1 : 3;
    docs.ipva.push({ year: Y, total: val, installments: Array.from({ length: parts }, (_, k) => {
      const dueK = new Date(Y, k, 12 + idx % 6).getTime(); const unpaid = v.id === 'v7' && k === parts - 1;
      return { n: k + 1, due: dueK, value: Math.round(val / parts * 100) / 100, paidAt: unpaid ? null : dueK - 2 * DAY, paidValue: null, receipt: unpaid ? null : { name: `comprovante_IPVA_${Y}_${v.plate}_${k + 1}.pdf`, size: 64000, type: 'application/pdf', data: null, demo: true } };
    }) });
  });
}

function imgToJpeg(src, maxW = 1000) {
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    im.onload = () => {
      const w0 = im.naturalWidth || 480, h0 = im.naturalHeight || 360; const sc = Math.min(1, maxW / w0);
      const c = document.createElement('canvas'); c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      try { res({ data: c.toDataURL('image/jpeg', .85), w: c.width, h: c.height }); } catch (e) { res(null); }
    };
    im.onerror = () => res(null); if (/^https?:/.test(src)) im.crossOrigin = 'anonymous'; im.src = src;
  });
}
async function offerFile(filename, blob) {
  // no visualizador do Claude a página pede confirmação para salvar; publicado no seu domínio, baixa direto
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;

  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); toast('PDF gerado.');
}

  /* ---------- arquivos: fotos e documentos vão para o Storage privado ---------- */
  async externalize() {
    const jobs = [];

      if (!obj || typeof obj !== 'object') return;
      for (const [k, v] of Object.entries(obj)) {
        if (typeof v === 'string' && v.startsWith('data:') && v.length > 200) jobs.push({ obj, k, v, table, id });
        else if (v && typeof v === 'object') walk(v, table, id);
      }
    };
    SPEC.forEach(sp => { if (!sp.single && !sp.asMap) listOf(sp).forEach(o => { if (!o._ro) walk(o, sp.table, o.id); }); });
    for (const j of jobs) {
      const m = /^data:([^;,]+)[;,]/.exec(j.v); const type = m ? m[1] : 'application/octet-stream';

      const bin = atob(j.v.slice(j.v.indexOf(',') + 1)); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

function friendlyError(e) {
  const m = String(e?.message || e || '');
  if (/custody_no_overlap/.test(m)) return 'o veículo já está com outro condutor.';
  if (/row-level security|Sem permissão|42501/.test(m) || e?.code === '42501') return 'seu perfil não tem permissão para esta ação.';
  if (/inativo/.test(m)) return 'seu acesso está inativo.';
  if (/JWT|expired|sess/i.test(m)) return 'sua sessão expirou. Entre novamente.';
  if (/duplicate key|unique/.test(m)) return 'já existe um registro igual (placa, código ou número repetido).';
  if (/violates check constraint/.test(m)) return 'algum valor está fora do permitido.';
  return m.replace(/^Error:\s*/, '');
}
function syncBadge() {
  if (APP_MODE !== 'cloud') return '';

  return `<span id="sync-badge" class="st small" title="${esc(CLOUD.lastError || 'Dados no servidor')}" style="white-space:nowrap"><span class="dot ${m[0]}"></span>${m[1]}</span>`;
}

function mountCloudLogin() {
  if (SERVER_OK === null) CLOUD.reachable().then(ok => { SERVER_OK = ok; const n = $('#srv-note'); if (n && !ok) n.textContent = 'O servidor não respondeu deste ambiente. Publicado no seu domínio o login funciona normalmente.'; });
  const f = $('#cl-form'); if (!f) return;
  f.addEventListener('submit', async e => {
    e.preventDefault(); const d = formData(f); const err = t => { LOGIN_MSG = t; const el = $('#login-err'); if (el) el.textContent = t; };
    const sb = CLOUD.client(); const btn = f.querySelector('.btn.pri, .btn.ok'); btn.disabled = true;
    try {
      if (LOGIN_VIEW === 'entrar') {
        LOGIN_MSG = '';
        const { data, error } = await sb.auth.signInWithPassword({ email: d.email, password: d.pass });
        if (error) { btn.disabled = false; return err(/Invalid login/i.test(error.message) ? 'E-mail ou senha incorretos.' : /banned/i.test(error.message) ? 'Seu acesso está inativo. Procure a gestão da frota.' : /confirm/i.test(error.message) ? 'Confirme o e-mail pelo link recebido antes de entrar.' : friendlyError(error)); }
        await CLOUD.enter(data.user);
      } else if (LOGIN_VIEW === 'esqueci') {
        const { error } = await sb.auth.resetPasswordForEmail(d.email, { redirectTo: location.origin + location.pathname });
        btn.disabled = false; err(error ? friendlyError(error) : 'Se o e-mail estiver cadastrado, o link chegará em alguns minutos.');
      } else {
        if ((d.pass || '').length < 8) { btn.disabled = false; return err('A senha precisa ter ao menos 8 caracteres.'); }
        const { data, error } = await sb.auth.signUp({ email: d.email, password: d.pass, options: { data: { name: d.name }, emailRedirectTo: location.origin + location.pathname } });
        btn.disabled = false;
        if (error) return err(friendlyError(error));
        if (data.session) return CLOUD.enter(data.user);
        LOGIN_VIEW = 'entrar'; LOGIN_MSG = 'Confira seu e-mail e clique no link de confirmação. Depois entre com a senha criada.'; render();
      }
    } catch (x) { btn.disabled = false; err(x instanceof TypeError ? 'Sem conexão com o servidor.' : friendlyError(x)); }
  });
}

/* ===================== Dados de exemplo no banco (para conhecer o sistema) ===================== */
function remapDemo(D) {
  const map = new Map();
  ['costCenters', 'projects', 'drivers', 'vehicles', 'qrcodes', 'custody', 'transfers', 'checklists', 'issues', 'fuel', 'plans', 'maintRecords', 'tolls', 'fines', 'notifications', 'audit', 'trackerEvents']
    .forEach(k => (D[k] || []).forEach(o => { if (!isUUID(o.id)) map.set(o.id, crypto.randomUUID()); }));
  (D.users || []).forEach(u => map.set(u.id, CUR.id));
  const walk = v => {
    if (typeof v === 'string') return map.has(v) ? map.get(v) : v;
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) o[map.has(k) ? map.get(k) : k] = walk(x); return o; }
    return v;
  };
  return walk(D);
}

function maintTable(vehicles, lvlFilter) {
  const rows = [];
  vehicles.forEach(v => vehicleMaint(v.id).items.filter(x => !lvlFilter || x.s.lvl === lvlFilter).forEach(({ p, s }) => {
    rows.push({ r: M_LEVEL[s.lvl].r, rem: s.remKm ?? 1e9, html: `<tr class="sev ${M_LEVEL[s.lvl].c === 'gray' ? '' : M_LEVEL[s.lvl].c}"><td>${vehLink(v.id)}</td><td>${esc(p.item)}</td>
      <td class="small">${[p.everyKm ? `a cada ${nf(p.everyKm)} km` : '', p.everyDays ? `a cada ${p.everyDays >= 365 && p.everyDays % 365 === 0 ? p.everyDays / 365 + (p.everyDays / 365 > 1 ? ' anos' : ' ano') : p.everyDays + ' dias'}` : ''].filter(Boolean).join(' ou ')}</td>
      <td class="r">${nf(v.odometer)}</td><td class="r small">${p.lastKm != null ? nf(p.lastKm) + ' km' : ''}${p.lastDate ? `<div class="muted">${fmtDate(p.lastDate)}</div>` : ''}</td>
      <td class="r small">${s.nextKm != null ? nf(s.nextKm) + ' km' : ''}${s.nextDate ? `<div class="muted">${fmtDate(s.nextDate)}</div>` : ''}</td>
      <td class="r nowrap">${s.remKm != null ? `<b>${nf(s.remKm)} km</b>` : ''}${s.remDays != null ? `<div class="small muted">${s.remDays} dias</div>` : ''}</td><td>${mLvl(s.lvl)}</td>
      ${isManager() ? `<td><button class="btn sm" data-act="mp-edit" data-id="${p.id}">Editar</button></td>` : ''}</tr>` });
  }));
  rows.sort((a, b) => b.r - a.r || a.rem - b.rem);
  return tbl(['Veículo', 'Item', 'Controle', '>Km atual', '>Última troca', '>Próxima', '>Restante', 'Situação', ...(isManager() ? [''] : [])], rows.map(r => r.html), 'Nenhum item neste filtro.');
}

      <div class="panel">${tollTable(list)}</div></div>`;

function importTolls(text) {
  let ok = 0; const errs = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
    const c = line.split(/[;\t]/).map(x => x.trim());
    if (/placa/i.test(c[0])) return;
    const [pl, dt, hr, place, val] = c; const m = dt?.match(/(\d{2})\/(\d{2})\/(\d{4})/); const h = hr?.match(/(\d{1,2}):(\d{2})/);
    const v = parseFloat(String(val || '').replace('R$', '').replace(/\./g, '').replace(',', '.'));
    if (!pl || !m || !h || !place || !v) { errs.push(`Linha ${i + 1}: formato inválido`); return; }
    const at = new Date(+m[3], +m[2] - 1, +m[1], +h[1], +h[2]).getTime();
    S.tolls.push({ id: uid('tol'), plate: pl.toUpperCase().replace(/[^A-Z0-9]/g, ''), at, place, value: v, invoice: 'Importação ' + fmtDate(nowTs()), manual: null }); ok++;
  });
  return { ok, errs };
}

};

let REP_CACHE = null;
PAGES.relatorios = {
  title: 'Relatórios',
  render({ per = 'mes' }) {
    const n = nowTs(); const ranges = { mes: [startOfMonth(n), n + 1, 'Este mês'], ant: [startOfMonth(startOfMonth(n) - DAY), startOfMonth(n), 'Mês anterior'], d60: [n - 60 * DAY, n + 1, 'Últimos 60 dias'] };
    const [from, to] = ranges[per]; const rows = periodCosts(from, to);
    const kinds = ['Combustível', 'Pedágios', 'Multas', 'Manutenção', 'Documentação'];
    const pivot = (key, label, kmFn) => {
      const ids = [...new Set(rows.map(r => r[key] || '_'))];
      const data = ids.map(id => { const rs = rows.filter(r => (r[key] || '_') === id); const o = { id, label: label(id) }; kinds.forEach(k => o[k] = sum(rs.filter(r => r.kind === k), r => r.value)); o.total = sum(rs, r => r.value); o.km = kmFn ? kmFn(id) : null; return o; }).sort((a, b) => b.total - a.total);
      return data;
    };
    const byV = pivot('vehicleId', id => veh(id)?.plate || 'Não identificado', id => kmInPeriod(from, to, c => c.vehicleId === id));
    const byP = pivot('projectId', id => prj(id)?.code || 'Sem obra');
    const byD = pivot('driverId', id => drv(id)?.name || 'Sem condutor (manutenção e não identificados)', id => kmInPeriod(from, to, c => c.driverId === id));
    REP_CACHE = { byV, byP, byD, kinds };
    const table = (data, first, withKm, key) => `<div class="panel"><div class="panel-h"><h3>Custo por ${first.toLowerCase()}</h3><button class="btn sm" data-act="rep-copy" data-k="${key}">Copiar tabela</button></div>${tbl([first, ...kinds.map(k => '>' + k), ...(withKm ? ['>Km', '>Custo/km'] : []), '>Total'], data.map(o => `<tr><td class="nowrap">${esc(o.label)}</td>${kinds.map(k => `<td class="r">${o[k] ? money(o[k]) : '<span class="muted">—</span>'}</td>`).join('')}${withKm ? `<td class="r">${nf(o.km)}</td><td class="r">${o.km > 0 ? money(o.total / o.km) : '—'}</td>` : ''}<td class="r"><b>${money(o.total)}</b></td></tr>`).concat([`<tr><td><b>Total</b></td>${kinds.map(k => `<td class="r"><b>${money(sum(data, o => o[k]))}</b></td>`).join('')}${withKm ? `<td class="r"><b>${nf(sum(data, o => o.km))}</b></td><td></td>` : ''}<td class="r"><b>${money(sum(data, o => o.total))}</b></td></tr>`]))}</div>`;
    return `<div class="page-head">      <div class="filters">${Object.entries(ranges).map(([k, r]) => `<button class="chip ${per === k ? 'on' : ''}" data-go="relatorios" data-per="${k}">${r[2]}</button>`).join('')}</div></div>
      <div class="stack">${table(byP, 'Obra', false, 'byP')}${table(byV, 'Veículo', true, 'byV')}${table(byD, 'Condutor', true, 'byD')}</div>`;
  }
};
ACTIONS['rep-copy'] = async a => {
  const data = REP_CACHE[a.dataset.k]; const k = REP_CACHE.kinds;
  const csv = ['Item;' + k.join(';') + ';Total', ...data.map(o => [o.label, ...k.map(x => nf(o[x], 2)), nf(o.total, 2)].join(';'))].join('\n');
  try { await navigator.clipboard.writeText(csv); toast('Tabela copiada. Cole no Excel.'); }
  catch (e) { openModal({ title: 'Copiar tabela', body: `<textarea class="inp mono" style="min-height:220px" readonly onfocus="this.select()">${esc(csv)}</textarea>` }); }
};
